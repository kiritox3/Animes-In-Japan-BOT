name: Caixa Android

on:
  push:
    branches: [claude/finance-app-minimal-xb0ksk]
    paths:
      - 'financas/**'
      - 'android/**'
      - '.github/workflows/caixa-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caixa-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Chave de envio para a Play Store (opcional). Sem estes segredos, usa a chave de teste do repositório.
      - name: Preparar chave de assinatura
        env:
          KS: ${{ secrets.CAIXA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CAIXA_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Gerar APK e AAB
        working-directory: android
        env:
          CAIXA_KEYSTORE_PASSWORD: ${{ secrets.CAIXA_KEYSTORE_PASSWORD }}
          CAIXA_KEY_ALIAS: ${{ secrets.CAIXA_KEY_ALIAS }}
          CAIXA_KEY_PASSWORD: ${{ secrets.CAIXA_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          # Arquivo da Play Store e APK público: Premium cobrado normalmente.
          # Repete se o repositório de bibliotecas recusar por excesso de pedidos (erro 429).
          for i in 1 2 3; do ./gradlew --no-daemon bundleRelease assembleRelease && break; [ $i = 3 ] && exit 1; sleep $((i*45)); done
          cp app/build/outputs/apk/release/app-release.apk ../Trocado.apk
          # APK pessoal (Premium liberado para teste): fica só nos artefatos da execução, nunca na página pública.
          ./gradlew --no-daemon assembleRelease -PunlockPremium=true
          cp app/build/outputs/apk/release/app-release.apk ../Trocado-pessoal.apk

      - name: Renomear arquivos
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab Trocado-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Trocado-apk
          path: Trocado.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Trocado-pessoal-premium
          path: Trocado-pessoal.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Trocado-playstore-aab
          path: Trocado-playstore.aab

      - name: Publicar na página de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caixa-android-latest
          name: Trocado para Android
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            Trocado.apk
            Trocado-playstore.aab
          body: |
            **Trocado.apk**: para instalar direto no celular (teste). Se o Play Protect bloquear, veja PUBLICAR.md.
            **Trocado-playstore.aab**: arquivo para enviar à Play Store.
            Depois de instalar, vá em Config > Ler notificações do banco para dar o acesso.

            Versão gerada automaticamente a partir do commit ${{ github.sha }}.
