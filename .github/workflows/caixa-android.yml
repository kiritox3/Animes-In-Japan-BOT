name: Caixa Android

on:
  push:
    branches: [claude/finance-app-minimal-xb0ksk]
    paths:
      - 'financas/**'
      - 'android/**'
      - '.github/workflows/caixa-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: caixa-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Chave de envio para a Play Store (opcional). Sem estes segredos, usa a chave de teste do repositório.
      - name: Preparar chave de assinatura
        env:
          KS: ${{ secrets.CAIXA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "CAIXA_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Gerar APK e AAB
        working-directory: android
        env:
          CAIXA_KEYSTORE_PASSWORD: ${{ secrets.CAIXA_KEYSTORE_PASSWORD }}
          CAIXA_KEY_ALIAS: ${{ secrets.CAIXA_KEY_ALIAS }}
          CAIXA_KEY_PASSWORD: ${{ secrets.CAIXA_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Renomear arquivos
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Caixa.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Caixa-playstore.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Caixa-apk
          path: Caixa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Caixa-playstore-aab
          path: Caixa-playstore.aab

      - name: Publicar na página de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: caixa-android-latest
          name: Caixa para Android
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            Caixa.apk
            Caixa-playstore.aab
          body: |
            **Caixa.apk**: para instalar direto no celular (teste). Se o Play Protect bloquear, veja PUBLICAR.md.
            **Caixa-playstore.aab**: arquivo para enviar à Play Store.
            Depois de instalar, vá em Config > Ler notificações do banco para dar o acesso.

            Versão gerada automaticamente a partir do commit ${{ github.sha }}.
