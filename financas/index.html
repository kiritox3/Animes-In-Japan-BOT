<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa Finanças</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D0D10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: coluna única de até 560px, escuro por padrão. Cabeçalho por aba, barra inferior fixa com 4 abas e botão flutuante (+). Formulários em bottom sheet. Tema e cor de destaque definidos pelo usuário em Config. */
:root{
  --bg:#0D0D10; --surface:#17171C; --raised:#202027; --sunk:#111115; --ink:#F3F2F7; --muted:#9D9CAA; --line:#2A2A33;
  --in:#4ADE95; --out:#FF7B6B; --warn:#F5C451;
  --accent:#9B7BFF; --on-accent:#FFFFFF;
  --accent-text:color-mix(in srgb,var(--accent) 72%,var(--ink));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Space Grotesk","Manrope",system-ui,sans-serif;
  --r:20px;
  color-scheme:dark;
}
:root.light{
  --bg:#F4F3F8; --surface:#FFFFFF; --raised:#F0EFF5; --sunk:#EAE9F0; --ink:#15141B; --muted:#686775; --line:#E1E0E9;
  --in:#13834F; --out:#D03E2D; --warn:#A06F00;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .pos{color:var(--in)} .neg{color:var(--out)} .wrn{color:var(--warn)}
svg{flex:none}

.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{font-family:var(--font-num);font-size:28px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font-size:13px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.newbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px 18px;font-size:16px}

.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;margin-top:6px}
.monthbar button{border:0;background:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.monthbar button:hover{background:var(--raised);color:var(--ink)}
.monthbar span{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.monthbar span svg{color:var(--accent-text)}

section{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h2{font-family:var(--font-num);font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em}
.link{border:0;background:none;color:var(--accent-text);font-weight:700;display:flex;align-items:center;gap:4px;padding:6px 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--font-num);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13px;margin-top:6px}
.banner button{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;flex:none}

/* saldo das contas */
.accs{display:flex;flex-direction:column;margin-top:12px}
.accrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left}
.accrow .n{flex:1;min-width:0;display:flex;flex-direction:column}
.accrow .n b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accrow .n small{color:var(--muted);font-size:12px}
.sw{width:10px;height:10px;border-radius:4px;flex:none}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
button.tile:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tile .k{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tile .k i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.tile .v{font-family:var(--font-num);font-size:20px;font-weight:600;letter-spacing:-.02em}
.tile small{font-size:12px;color:var(--muted)}

/* gasto diário */
.daily{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface) 75%);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.daily .big{font-size:40px}
.daily p{margin:0;font-size:13px;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;justify-content:center}
.act.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* barras */
.lim{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.lim:first-child{border-top:0;padding-top:0}
.lim .r{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.lim .r b{font-weight:600}
.track{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.lim small{font-size:12px;color:var(--muted)}

/* cartões */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;scrollbar-width:none;padding-bottom:2px}
.carousel::-webkit-scrollbar{display:none}
.cslide{flex:0 0 88%;max-width:440px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.cslide:only-child{flex-basis:100%}
.ccard{aspect-ratio:1.586;max-width:100%;border-radius:22px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%}
.ccard::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.ccard.dk{color:#16151b}
.ccard .row1{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.chipc{width:46px;height:34px;border-radius:8px;background:linear-gradient(135deg,#f2f2f2,#bdbdbd);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chipc::before{content:"";position:absolute;inset:9px 0;border-top:1px solid rgba(0,0,0,.25);border-bottom:1px solid rgba(0,0,0,.25)}
.chipc::after{content:"";position:absolute;inset:0 15px;border-left:1px solid rgba(0,0,0,.25);border-right:1px solid rgba(0,0,0,.25)}
.ccard .bank{position:relative;z-index:1;font-family:var(--font-num);font-weight:700;font-size:clamp(22px,7vw,30px);letter-spacing:-.03em;line-height:1}
.ccard .bank small{display:block;font-family:var(--font-ui);font-weight:600;font-size:12px;opacity:.8;letter-spacing:.04em;margin-top:6px}
.ccard .row2{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;font-weight:600}
.ccard .dig{font-family:var(--font-num);letter-spacing:.18em;font-size:14px;opacity:.9}
.cinfo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.cinfo .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:16px}
.cinfo .amt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cinfo .amt .big{font-size:30px}
.cinfo .amt .rt{text-align:right;font-size:13px;color:var(--muted)}
.cinfo .amt .rt b{display:block;font-family:var(--font-num);font-size:18px;color:var(--accent-text)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.tag.ac{color:var(--accent-text)}
.limbox{border:1px solid var(--line);background:var(--sunk);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.limbox .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.limbox .r b{font-family:var(--font-num);font-size:22px}
.limbox .track i{background:var(--in)}
.limbox small{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.carfoot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.carfoot b{color:var(--accent-text)}

/* chips de status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--in);background:color-mix(in srgb,var(--in) 14%,transparent)}
.st.wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.bad{color:var(--out);background:color-mix(in srgb,var(--out) 14%,transparent)}
.st.ac{color:var(--accent-text);background:var(--accent-soft)}

/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;background:none;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
button.row:hover{background:var(--raised)}
.bub{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .amt .num{font-weight:700;font-size:15px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:12px}

/* gastos */
.hero{border-radius:24px;padding:20px 16px;color:var(--on-accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,#000) ,var(--accent));display:flex;flex-direction:column;gap:16px;margin-top:14px}
.hero .lbl{color:inherit;opacity:.85}
.hero .big{font-size:40px}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .trio>button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:16px;padding:11px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.hero .trio>button[aria-pressed="true"]{background:rgba(255,255,255,.28)}
.hero .trio b{font-family:var(--font-num);font-size:clamp(12.5px,3.4vw,16px);line-height:1.2;overflow-wrap:anywhere}
.hero .trio small{font-size:12px;opacity:.85}
.hero .trio i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.searchrow{display:flex;gap:10px;margin-top:14px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none;color:var(--ink)}
.fbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;color:var(--accent-text);font-weight:700}
.fbtn em{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:11px;padding:1px 7px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:12px 2px}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:14px}
.pill span{color:var(--muted);font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill[aria-pressed="true"] span{color:inherit;opacity:.85}
.pills .sep{width:1px;background:var(--line);flex:none;margin-block:6px}
.countbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-top:12px}
.countbar button{border:0;background:none;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600;padding:6px 0}
.blockh{display:flex;align-items:center;gap:10px;font-family:var(--font-num);font-weight:600;font-size:19px;margin:22px 0 2px}
.blockh svg{color:var(--accent-text)}
.blocksub{font-size:13px;color:var(--muted);margin:0 0 10px}

/* análises */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.donut{display:grid;grid-template-columns:1fr;justify-items:center;gap:14px}
.donut .legend{width:100%}
@media (min-width:520px){.donut{grid-template-columns:150px 1fr;justify-items:stretch;align-items:center}}
.donut svg{width:150px;height:150px}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;border:0;background:none;padding:6px 0;text-align:left;font-size:13.5px;min-width:0}
.legend button span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartbox svg{width:100%;height:auto;display:block}
.chartleg{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.chartleg span{display:flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hbar:first-child{border-top:0;padding-top:0}
.hbar .track{grid-column:1/-1}

/* config */
.cfg{display:flex;flex-direction:column}
.cfgrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;min-height:56px}
.cfgrow:first-child{border-top:0}
button.cfgrow:hover{background:var(--raised)}
.cfgrow .n{flex:1;min-width:0;display:flex;flex-direction:column}
.cfgrow .n b{font-weight:600}
.cfgrow .n small{font-size:12.5px;color:var(--muted)}
.cfgrow .tools{display:flex;gap:4px}
.cfgrow .tools button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.cfgrow .tools button:disabled{opacity:.35}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--raised);border:1px solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle:checked{background:var(--accent);border-color:var(--accent)}
.toggle:checked::after{transform:translateX(18px);background:var(--on-accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button,.swatches label{width:36px;height:36px;border-radius:12px;border:2px solid transparent;padding:0;position:relative;overflow:hidden;cursor:pointer}
.swatches [aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.swatches label{border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.swatches label input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:68px}
nav.tabs .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs .tab[aria-current="page"]{color:var(--accent-text)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .2s}
.scrim.open .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 16px;font-size:21px;font-family:var(--font-num);font-weight:700;letter-spacing:-.02em}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lb{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.amount input{font-family:var(--font-num);font-size:32px;font-weight:700;padding:10px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px}
.chips button i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}

function migrate(o){ // v1 -> v2
  const s=defaults();s.demo=!!o.demo;
  const map={};(o.cats&&o.cats.out||[]).forEach(n=>{let c=s.cats.find(x=>x.type==='out'&&x.name===n);if(!c){c={id:'c_'+uid(),type:'out',name:n,icon:'dots',color:PALETTE[s.cats.length%PALETTE.length]};s.cats.push(c)}map['out|'+n]=c.id});
  (o.cats&&o.cats.in||[]).forEach(n=>{let c=s.cats.find(x=>x.type==='in'&&x.name===n);if(!c){c={id:'c_'+uid(),type:'in',name:n,icon:'dots',color:PALETTE[s.cats.length%PALETTE.length]};s.cats.push(c)}map['in|'+n]=c.id});
  s.cards=(o.cards||[]).map(c=>({...c,color2:c.color,last4:'',accountId:s.accounts[0].id}));
  s.tx=(o.tx||[]).map(t=>({id:t.id,type:t.type,amount:t.amount,desc:t.desc,catId:map[t.type+'|'+t.cat]||'',date:t.date,method:t.card?'credito':'pix',card:t.card||'',inv:t.inv||'',inst:t.inst||null,group:t.group||null,paid:t.card?true:!!t.paid,accountId:s.accounts[0].id,note:''}));
  for(const k in o.paidInv||{})s.paidInv[k]={acc:s.accounts[0].id,date:TODAY};
  for(const n in o.budgets||{}){const id=map['out|'+n];if(id)s.plan.budgets[id]=o.budgets[n]}
  return s}

const catById=id=>S.cats.find(c=>c.id===id)||{id:'',name:'Sem categoria',icon:'dots',color:'#9D9CAA',type:'out'};
const catsOf=type=>S.cats.filter(c=>c.type===type);
const accById=id=>S.accounts.find(a=>a.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
const CC=()=>S.cards.filter(c=>c.kind!=='debito');
const DC=()=>S.cards.filter(c=>c.kind==='debito'||c.kind==='ambos');
const isCredit=t=>t.type==='out'&&t.method==='credito'&&!!t.card;
function invOf(card,date){const ym=ymOf(date),d=+date.slice(8);const closeYm=d>=card.close?addM(ym,1):ym;return card.due>card.close?closeYm:addM(closeYm,1)}
function invDates(card,k){const closeYm=card.due>card.close?k:addM(k,-1);return{close:dayIn(closeYm,card.close),due:dayIn(k,card.due)}}
const invKey=(cid,k)=>cid+'|'+k;
const invTx=(cid,k)=>S.tx.filter(t=>isCredit(t)&&t.card===cid&&t.inv===k);
const invTotal=(cid,k)=>invTx(cid,k).reduce((s,t)=>s+t.amount,0);
const invPaid=(cid,k)=>!!S.paidInv[invKey(cid,k)];
function invStatus(card,k){const{close,due}=invDates(card,k);
  if(invPaid(card.id,k))return{l:'Paga',c:'ok'};
  if(TODAY<close)return{l:'Aberta',c:'ac'};
  if(TODAY>due)return{l:'Vencida',c:'bad'};
  return{l:'Fechada',c:'wait'}}
function cardKeys(c){return[...new Set(S.tx.filter(t=>isCredit(t)&&t.card===c.id).map(t=>t.inv))]}
function cardUsed(c){return cardKeys(c).reduce((s,k)=>s+(invPaid(c.id,k)?0:invTotal(c.id,k)),0)}
const isLate=t=>!t.paid&&!isCredit(t)&&t.date<TODAY;
function txStatus(t){if(isCredit(t))return null;if(t.type==='in')return t.paid?{l:'Recebido',c:'ok'}:{l:'A receber',c:'wait'};if(t.paid)return{l:'Paga',c:'ok'};if(t.date<TODAY)return{l:'Atrasada',c:'bad'};return{l:'A pagar',c:'wait'}}
const monthOfTx=t=>isCredit(t)?t.inv:ymOf(t.date);
function invoicesDue(M){return CC().map(c=>{const d=invDates(c,M);return{c,k:M,total:invTotal(c.id,M),paid:invPaid(c.id,M),close:d.close,due:d.due}}).filter(v=>v.total>0)}
function monthOut(M){const items=S.tx.filter(t=>t.type==='out'&&!isCredit(t)&&ymOf(t.date)===M);const inv=invoicesDue(M);
  let total=0,paid=0;items.forEach(t=>{total+=t.amount;if(t.paid)paid+=t.amount});inv.forEach(v=>{total+=v.total;if(v.paid)paid+=v.total});
  return{items,inv,total,paid,open:total-paid}}
function monthIn(M){const items=S.tx.filter(t=>t.type==='in'&&ymOf(t.date)===M);let total=0,rec=0;items.forEach(t=>{total+=t.amount;if(t.paid)rec+=t.amount});return{items,total,rec}}
function accBalance(a){let b=a.initial||0;for(const t of S.tx){if(t.accountId!==a.id||isCredit(t)||!t.paid)continue;b+=t.type==='in'?t.amount:-t.amount}
  for(const k in S.paidInv){const p=S.paidInv[k];if(p&&p.acc===a.id){const i=k.indexOf('|');b-=invTotal(k.slice(0,i),k.slice(i+1))}}
  for(const tr of S.transfers||[]){if(tr.from===a.id)b-=tr.amount;if(tr.to===a.id)b+=tr.amount}return b}
function catSpend(M){const by={};for(const t of S.tx){if(t.type!=='out'||monthOfTx(t)!==M)continue;by[t.catId]=(by[t.catId]||0)+t.amount}return by}
function outlook(){
  const saldo=S.accounts.filter(a=>a.include!==false).reduce((s,a)=>s+accBalance(a),0);
  let pagar=0,receber=0;
  for(const t of S.tx){if(t.paid||isCredit(t)||ymOf(t.date)>CM)continue;if(t.type==='out')pagar+=t.amount;else receber+=t.amount}
  for(const c of S.cards)cardKeys(c).forEach(k=>{if(k<=CM&&!invPaid(c.id,k))pagar+=invTotal(c.id,k)});
  const livre=saldo+receber-pagar;const daysLeft=dim(CM)-(+TODAY.slice(8))+1;
  const spent=monthOut(CM).total;let perDay=Math.max(0,livre)/daysLeft;let byLimit=null;
  if(S.plan.limit>0){byLimit=Math.max(0,S.plan.limit-spent)/daysLeft;perDay=Math.min(perDay,byLimit)}
  return{saldo,pagar,receber,livre,daysLeft,perDay:Math.floor(perDay),byLimit,spent}}
function avgSurplus(){let s=0;for(let k=1;k<=3;k++){const m=addM(CM,-k);s+=monthIn(m).total-monthOut(m).total}return Math.round(s/3)}

function vGastos(){

function applyCommon(list){
  if(gq){const q=gq.toLowerCase();list=list.filter(t=>(t.desc+' '+catById(t.catId).name+' '+(t.note||'')).toLowerCase().includes(q))}
  if(gcat)list=list.filter(t=>t.catId===gcat);
  if(gacc)list=list.filter(t=>gacc.startsWith('k:')?t.card===gacc.slice(2)&&isCredit(t):t.accountId===gacc.slice(2)&&!isCredit(t));
  return list}
function sortList(list){const f={recent:(a,b)=>a.date<b.date?1:a.date>b.date?-1:0,value:(a,b)=>b.amount-a.amount,due:(a,b)=>a.date<b.date?-1:a.date>b.date?1:0}[gsort];return list.sort(f)}
const SORTL={recent:'Mais recentes',value:'Maior valor',due:'Vencimento'};
const filterCount=()=>(gcat?1:0)+(gacc?1:0);
function searchRow(ph){return `<div class="searchrow"><label class="search">${ic('search',20)}<input id="gq" type="search" placeholder="${ph}" value="${esc(gq)}" autocomplete="off"></label><button type="button" class="fbtn" data-act="filters">${ic('filter',20)}Filtros${filterCount()?`<em>${filterCount()}</em>`:''}</button></div>`}
function gOut(){
  const o=monthOut(M);const hl=S.settings.highlight;const hlTotal=S.tx.filter(t=>t.type==='out'&&t.method===hl&&monthOfTx(t)===M).reduce((s,t)=>s+t.amount,0);
  const hlLabel=(HIGHLIGHTS.find(x=>x[0]===hl)||HIGHLIGHTS[0])[1];
  let items=applyCommon(o.items.slice());let invs=o.inv.slice();
  if(gq||gcat||gacc){const vis=new Set(applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)).map(t=>t.card));invs=invs.filter(v=>vis.has(v.c.id))}
  const cnt={all:items.length+invs.length,open:items.filter(t=>!t.paid).length+invs.filter(v=>!v.paid).length,paid:items.filter(t=>t.paid).length+invs.filter(v=>v.paid).length,late:items.filter(isLate).length+invs.filter(v=>!v.paid&&v.due<TODAY).length};
  const ms=METHODS.map(m=>({...m,n:m.id==='credito'?applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)).length:items.filter(t=>t.method===m.id).length})).filter(m=>m.n>0);
  let credit=null;
  if(gmethod==='credito'){credit=sortList(applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)));items=[];invs=[]}
  else if(gmethod){items=items.filter(t=>t.method===gmethod);invs=[]}
  const sf={all:()=>true,open:t=>!t.paid,paid:t=>t.paid,late:isLate}[gstatus];
  const vf={all:()=>true,open:v=>!v.paid,paid:v=>v.paid,late:v=>!v.paid&&v.due<TODAY}[gstatus];
  items=sortList(items.filter(sf));invs=invs.filter(vf);
  const total=credit?credit.length:items.length+invs.length;
  const pill=(k,l,n)=>`<button type="button" class="pill" data-act="gstatus" data-v="${k}" aria-pressed="${gstatus===k&&!gmethod}">${l} <span>${n}</span></button>`;
  return `<div class="hero"><div><div class="lbl">Total do mês</div><div class="big num" style="margin-top:6px">${fmt(o.total)}</div></div>
    <div class="trio"><button type="button" data-act="gstatus" data-v="paid" aria-pressed="${gstatus==='paid'}"><i style="color:var(--in)">${ic('check',14,3)}</i><b class="num">${fmt(o.paid)}</b><small>Pago</small></button>
    <button type="button" data-act="gstatus" data-v="open" aria-pressed="${gstatus==='open'}"><i style="color:#b88300">${ic('clock',14,2.6)}</i><b class="num">${fmt(o.open)}</b><small>A pagar</small></button>
    <button type="button" data-act="gmethod" data-v="${hl}" aria-pressed="${gmethod===hl}"><i style="color:var(--accent)">${ic(methodBy(hl).i,14,2.6)}</i><b class="num">${fmt(hlTotal)}</b><small>${hlLabel}</small></button></div></div>
  ${searchRow('Buscar um gasto')}
  <div class="pills">${pill('all','Todas',cnt.all)}${pill('open','A pagar',cnt.open)}${pill('paid','Pagas',cnt.paid)}${pill('late','Atrasadas',cnt.late)}
   ${ms.length?'<span class="sep"></span>':''}${ms.map(m=>`<button type="button" class="pill" data-act="gmethod" data-v="${m.id}" aria-pressed="${gmethod===m.id}">${ic(m.i,16,2.2)}${m.l} <span>${m.n}</span></button>`).join('')}</div>
  <div class="countbar"><span>${total} ${credit?'compra'+(total===1?'':'s')+' no crédito':'compromisso'+(total===1?'':'s')}</span><button type="button" data-act="sort">${ic('sort',18)}${SORTL[gsort]}</button></div>
  ${credit?`<div class="blockh">${ic('card',22)}Compras no crédito</div><p class="blocksub">Compras que caem nas faturas que vencem em ${monthName(M)}.</p><div class="panel list">${credit.length?credit.map(txRow).join(''):'<div class="empty">Nenhuma compra.</div>'}</div>`:
   `${invs.length?`<div class="blockh">${ic('card',22)}Faturas dos cartões</div><p class="blocksub">Compras no crédito ficam dentro de cada fatura.</p><div class="panel list">${invs.map(invRow).join('')}</div>`:''}
    <div class="blockh">${ic('receipt',22)}Contas e gastos</div><p class="blocksub">Pix, débito, boletos e dinheiro de ${monthName(M)}.</p>
    <div class="panel list">${items.length?items.map(txRow).join(''):`<div class="empty">Nenhum gasto${gq||gcat||gacc||gstatus!=='all'||gmethod?' com esse filtro':''}.<button type="button" class="act pri" data-act="new">${ic('plus',18)}Adicionar gasto</button></div>`}</div>`}`}
function gIn(){const i=monthIn(M);let items=applyCommon(i.items.slice());

   <div class="trio" style="grid-template-columns:1fr 1fr"><button type="button" data-act="gstatus" data-v="paid" aria-pressed="${gstatus==='paid'}"><b class="num">${fmt(i.rec)}</b><small>Recebido</small></button><button type="button" data-act="gstatus" data-v="open" aria-pressed="${gstatus==='open'}"><b class="num">${fmt(i.total-i.rec)}</b><small>A receber</small></button></div></div>

  <div class="countbar"><span>${items.length} entrada${items.length===1?'':'s'}</span><button type="button" data-act="sort">${ic('sort',18)}${SORTL[gsort]}</button></div>
  <div class="panel list" style="margin-top:8px">${items.length?items.map(txRow).join(''):`<div class="empty">Nenhuma entrada.<button type="button" class="act pri" data-act="newin">${ic('plus',18)}Adicionar entrada</button></div>`}</div>`}

/* ================= ANÁLISES ================= */
function vAnalises(){
  const h=`<h1 class="ttl">Análises</h1>`;
  const o=monthOut(M),i=monthIn(M),po=monthOut(addM(M,-1));
  const delta=po.total?Math.round((o.total-po.total)/po.total*100):null;
  const bal=i.total-o.total,rate=i.total?Math.round(bal/i.total*100):null;
  const kp=(k,v,sub,cls='')=>`<div class="tile"><span class="k">${k}</span><span class="v num ${cls}">${v}</span><small>${sub}</small></div>`;
  let body=monthBar()+`<div class="kpis">
   ${kp('Gastos',fmt(o.total),delta==null?'Sem mês anterior':`<span class="${delta>0?'neg':'pos'}">${delta>0?'▲':'▼'} ${Math.abs(delta)}%</span> vs ${MSH[+addM(M,-1).slice(5)-1]}`)}
   ${kp('Entradas',fmt(i.total),`${fmt(i.rec)} recebido`)}
   ${kp('Saldo do mês',fmt(bal),bal>=0?'Sobrou dinheiro':'Gastou mais do que entrou',bal<0?'neg':'pos')}
   ${kp('Taxa de economia',rate==null?'—':rate+'%',rate==null?'Sem entradas':rate>=20?'Ótimo ritmo':rate>=0?'Dá para melhorar':'No vermelho',rate!=null&&rate<0?'neg':'')}</div>`;
  // categorias
  const by=catSpend(M);const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);const tot=ent.reduce((s,e)=>s+e[1],0);
  let donut='<div class="empty">Sem gastos neste mês.</div>';
  if(tot>0){const R=58,C=2*Math.PI*R;let off=0,arcs='';ent.forEach(([id,v])=>{const c=catById(id);const len=v/tot*C;arcs+=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${c.color}" stroke-width="20" stroke-dasharray="${Math.max(0,len-1.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len});
    donut=`<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="Gastos por categoria"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--raised)" stroke-width="20"/>${arcs}<text x="75" y="71" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Manrope,system-ui">Total</text><text x="75" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Space Grotesk,system-ui">${S.settings.hide?'•••':brl.format(tot/100).replace(/,\d\d$/,'')}</text></svg>
    <div class="legend">${ent.map(([id,v])=>{const c=catById(id);return `<button type="button" data-act="catfilter" data-id="${id}"><span class="sw" style="background:${c.color};border-radius:50%"></span><span>${esc(c.name)}</span><span class="num"><b>${Math.round(v/tot*100)}%</b> <span class="muted">${fmt(v)}</span></span></button>`}).join('')}</div></div>`}
  body+=`<section><div class="sec-h"><h2>Por categoria</h2></div><div class="panel pad">${donut}</div></section>`;
  body+=`<section><div class="sec-h"><h2>Últimos 6 meses</h2></div><div class="panel pad chartbox">${chart6()}</div></section>`;
  body+=`<section><div class="sec-h"><h2>Gasto por dia</h2></div><div class="panel pad chartbox">${chartDays()}</div></section>`;
  // método
  const bm={};S.tx.forEach(t=>{if(t.type==='out'&&monthOfTx(t)===M)bm[t.method]=(bm[t.method]||0)+t.amount});
  const me=Object.entries(bm).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...me.map(e=>e[1]));
  body+=`<section><div class="sec-h"><h2>Forma de pagamento</h2></div><div class="panel pad">${me.length?me.map(([id,v])=>{const m=methodBy(id);return `<div class="hbar"><span style="display:flex;align-items:center;gap:8px">${ic(m.i,16)}${m.l}</span><span class="num" style="font-weight:700">${fmt(v)}</span><div class="track"><i style="width:${v/mx*100}%"></i></div></div>`}).join(''):'<div class="empty">Sem dados.</div>'}</div></section>`;
  if(CC().length){const cs=CC().map(c=>[c,invTotal(c.id,M)]);const cx=Math.max(1,...cs.map(x=>x[1]));
    body+=`<section><div class="sec-h"><h2>Faturas de ${monthName(M)}</h2></div><div class="panel pad">${cs.map(([c,v])=>`<div class="hbar"><span style="display:flex;align-items:center;gap:8px"><span class="sw" style="${cardBg(c)}"></span>${esc(c.name)}</span><span class="num" style="font-weight:700">${fmt(v)}</span><div class="track"><i style="width:${v/cx*100}%;${cardBg(c)}"></i></div></div>`).join('')}</div></section>`}
  const top=S.tx.filter(t=>t.type==='out'&&monthOfTx(t)===M).sort((a,b)=>b.amount-a.amount).slice(0,5);
  body+=`<section><div class="sec-h"><h2>Maiores gastos</h2></div><div class="panel list">${top.length?top.map(txRow).join(''):'<div class="empty">Sem gastos.</div>'}</div></section>`;
  return[h,body]}
function chart6(){const ms=[];for(let k=-5;k<=0;k++)ms.push(addM(M,k));
  const data=ms.map(m=>({i:monthIn(m).total,o:monthOut(m).total}));const max=Math.max(1,...data.map(d=>Math.max(d.i,d.o)));
  const W=320,H=160,pt=16,pb=22,gw=W/6,bw=13;let s='';
  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`});
  data.forEach((d,k)=>{const cx=gw*k+gw/2,base=H-pb,cur=ms[k]===M;const h1=(H-pt-pb)*d.i/max,h2=(H-pt-pb)*d.o/max;
    s+=`<rect x="${cx-bw-1.5}" y="${base-h1}" width="${bw}" height="${Math.max(h1,1)}" rx="4" fill="var(--in)" opacity="${cur?1:.45}"/><rect x="${cx+1.5}" y="${base-h2}" width="${bw}" height="${Math.max(h2,1)}" rx="4" fill="var(--accent)" opacity="${cur?1:.45}"/>`;
    s+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="11" font-weight="${cur?800:500}" fill="${cur?'var(--ink)':'var(--muted)'}" font-family="Manrope,system-ui">${MSH[+ms[k].slice(5)-1]}</text>`});
  s+=`<text x="2" y="11" font-size="10" fill="var(--muted)" font-family="Manrope,system-ui">${S.settings.hide?'':brl.format(max/100).replace(/,\d\d$/,'')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e gastos dos últimos 6 meses">${s}</svg><div class="chartleg"><span><span class="sw" style="background:var(--in)"></span>Entradas</span><span><span class="sw" style="background:var(--accent)"></span>Gastos</span></div>`}
function chartDays(){const n=dim(M);const d=new Array(n).fill(0);S.tx.forEach(t=>{if(t.type==='out'&&ymOf(t.date)===M)d[+t.date.slice(8)-1]+=t.amount});
  const tot=d.reduce((a,b)=>a+b,0);const upto=M===CM?+TODAY.slice(8):M<CM?n:0;const avg=upto?Math.round(d.slice(0,upto).reduce((a,b)=>a+b,0)/upto):0;
  const max=Math.max(1,...d);const W=320,H=130,pt=10,pb=18,bw=W/n;let s='';
  d.forEach((v,k)=>{const h=(H-pt-pb)*v/max;const isT=M===CM&&k+1===+TODAY.slice(8);s+=`<rect x="${k*bw+1}" y="${H-pb-h}" width="${Math.max(1,bw-2)}" height="${Math.max(h,v?2:1)}" rx="2" fill="${isT?'var(--accent)':'color-mix(in srgb,var(--accent) 55%,var(--raised))'}" opacity="${v?1:.4}"/>`});
  if(avg){const y=H-pb-(H-pt-pb)*avg/max;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.5"/>`}
  [1,10,20,n].forEach(k=>{s+=`<text x="${(k-.5)*bw}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Manrope,system-ui">${k}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por dia do mês">${s}</svg><div class="chartleg"><span><span class="sw" style="background:var(--accent)"></span>Pela data da compra</span><span><span class="sw" style="background:var(--warn)"></span>Média ${fmt(avg)}/dia</span></div><p class="hint" style="margin-top:6px">Total no mês: ${fmt(tot)}</p>`}

/* ================= sheets ================= */
let scrim=null;
function openSheet(html,mount){closeSheet(true);
  scrim=document.createElement('div');scrim.className='scrim';
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  scrim.addEventListener('click',e=>{if(e.target===scrim)closeSheet()});
  document.body.appendChild(scrim);document.body.style.overflow='hidden';
  requestAnimationFrame(()=>scrim&&scrim.classList.add('open'));
  mount&&mount(scrim.querySelector('.sheet'))}
function closeSheet(instant){if(!scrim)return;const s=scrim;scrim=null;document.body.style.overflow='';if(instant){s.remove();return}s.classList.remove('open');setTimeout(()=>s.remove(),200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function armDanger(btn,fn){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');const o=btn.innerHTML;btn.textContent='Toque de novo para confirmar';setTimeout(()=>{btn.classList.remove('armed');btn.innerHTML=o},3000)}
const done=msg=>{save();closeSheet();render();if(msg)toast(msg)};
const pressGroup=(root,sel,el)=>root.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',b===el));
const sel=(id,opts,val)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

function txForm(t,pre={}){

  if(!f.catId)f.catId=(catsOf(f.type)[0]||{}).id||'';
  if(!f.card)f.card=(CC()[0]||{}).id||'';
  const grouped=editing&&t.group;
  const catChips=tp=>catsOf(tp).map(c=>`<button type="button" data-cat="${c.id}" aria-pressed="${f.catId===c.id}"><i style="background:color-mix(in srgb,${c.color} 22%,transparent);color:${c.color}">${cicon(c,14,2.2)}</i>${esc(c.name)}</button>`).join('');
  const methChips=tp=>METHODS.filter(m=>tp==='out'||IN_METHODS.includes(m.id)).filter(m=>m.id!=='credito'||CC().length).map(m=>`<button type="button" data-meth="${m.id}" aria-pressed="${f.method===m.id}"><i>${ic(m.i,15,2.2)}</i>${m.l}</button>`).join('');
  openSheet(`<h3>${editing?(f.type==='in'?'Editar entrada':'Editar gasto'):'Novo lançamento'}</h3>
  <form class="form" id="txf" novalidate>
    ${editing?'':`<div class="seg" role="group"><button type="button" data-type="out" aria-pressed="${f.type==='out'}">Gasto</button><button type="button" data-type="in" aria-pressed="${f.type==='in'}">Entrada</button></div>`}
    <div class="field amount"><label for="f-amount" id="l-amount">Valor</label><input id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${f.amount?toInput(f.amount):''}"></div>
    <div class="field"><label for="f-desc">Descrição</label><input id="f-desc" placeholder="Ex.: mercado, aluguel, Netflix" value="${esc(f.desc)}" autocomplete="off"></div>
    <div class="field"><span class="lb">Categoria</span><div class="chips" id="catchips">${catChips(f.type)}</div></div>
    <div class="field" id="w-sub"><span class="lb">Subcategoria</span><div class="chips" id="subchips"></div></div>
    <div class="field"><span class="lb">Forma de pagamento</span><div class="chips" id="methchips" ${grouped?'style="pointer-events:none;opacity:.6"':''}>${methChips(f.type)}</div></div>
    <div id="w-credit" class="two"><div class="field"><label for="f-card">Cartão</label>${sel('f-card',CC().map(c=>[c.id,c.name]),f.card)}</div>
      ${editing?'':`<div class="field"><label for="f-n">Parcelas</label><input id="f-n" type="number" min="1" max="48" inputmode="numeric" value="${f.n||1}"></div>`}</div>
    <div id="w-acc" class="field"><label for="f-acc">Conta</label>${sel('f-acc',S.accounts.map(a=>[a.id,a.name]),f.accountId)}</div>
    <div id="w-status" class="seg" role="group"><button type="button" data-paid="1" aria-pressed="${!!f.paid}" id="b-paid">Pago</button><button type="button" data-paid="0" aria-pressed="${!f.paid}" id="b-open">A pagar</button></div>
    <div class="two"><div class="field"><label for="f-date" id="l-date">Data</label><input id="f-date" type="date" value="${f.date}"></div>
      ${editing?'':`<div class="field" id="w-rep"><label for="f-rep">Repetir (meses)</label><input id="f-rep" type="number" min="1" max="60" inputmode="numeric" value="1"></div>`}</div>
    <p class="hint" id="hint"></p>
    <div class="field"><label for="f-note">Observação</label><input id="f-note" value="${esc(f.note||'')}" placeholder="Opcional" autocomplete="off"></div>
    <div class="btns"><button class="btn" type="submit">${ic('check',20,2.6)}${editing?'Salvar':'Adicionar'}</button></div>
    ${editing?`<div class="btns"><button type="button" class="btn danger" id="del1">${ic('trash',18)}Excluir${grouped?' só este':''}</button>${grouped?`<button type="button" class="btn danger" id="delAll">Excluir todos (${S.tx.filter(x=>x.group===t.group).length})</button>`:''}</div>`:''}
  </form>`,sh=>{
    const $=s=>sh.querySelector(s);
    const drawSubs=()=>{const subs=catById(f.catId).subs||[];$('#w-sub').hidden=!subs.length;$('#subchips').innerHTML=subs.map(x=>`<button type="button" style="padding-left:12px" data-sub="${esc(x)}" aria-pressed="${f.sub===x}">${esc(x)}</button>`).join('')};drawSubs();
    const sync=()=>{const cr=f.type==='out'&&f.method==='credito';
      $('#w-credit').hidden=!cr;$('#w-acc').hidden=cr;$('#w-status').hidden=cr;
      $('#b-paid').textContent=f.type==='in'?'Recebido':'Pago';$('#b-open').textContent=f.type==='in'?'A receber':'A pagar';
      $('#l-date').textContent=cr?'Data da compra':f.paid?'Data':(f.type==='in'?'Previsão':'Vencimento');
      if($('#w-rep'))$('#w-rep').hidden=cr;
      let hint='';if(cr){const c=cardById($('#f-card').value);if(c){const k=invOf(c,$('#f-date').value||TODAY);const n=$('#f-n')?Math.max(1,+$('#f-n').value||1):1;hint=`Entra na fatura de ${monthName(k)} (vence ${dShort(invDates(c,k).due)})${n>1?`, em ${n} parcelas de ${fmt(Math.round((parseMoney($('#f-amount').value)||0)/n))}`:''}.`}}
      else if($('#f-rep')&&+$('#f-rep').value>1)hint=`Será lançado em ${+$('#f-rep').value} meses seguidos, com o mesmo valor. Bom para contas fixas.`;
      $('#hint').textContent=hint;$('#hint').hidden=!hint;
      $('#l-amount').textContent=t&&t.inst?`Valor da parcela ${t.inst.n}/${t.inst.of}`:cr&&$('#f-n')&&+$('#f-n').value>1?'Valor total da compra':'Valor'};
    sh.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
      if(b.dataset.type){f.type=b.dataset.type;pressGroup(sh,'[data-type]',b);if(!catsOf(f.type).some(c=>c.id===f.catId))f.catId=(catsOf(f.type)[0]||{}).id||'';$('#catchips').innerHTML=catChips(f.type);f.sub='';drawSubs();if(f.type==='in'&&!IN_METHODS.includes(f.method))f.method='pix';$('#methchips').innerHTML=methChips(f.type);sync()}
      else if(b.dataset.cat){f.catId=b.dataset.cat;pressGroup(sh,'[data-cat]',b);f.sub='';drawSubs()}
      else if(b.dataset.sub!==undefined){f.sub=f.sub===b.dataset.sub?'':b.dataset.sub;drawSubs()}
      else if(b.dataset.meth){f.method=b.dataset.meth;pressGroup(sh,'[data-meth]',b);sync()}
      else if(b.dataset.paid){f.paid=b.dataset.paid==='1';pressGroup(sh,'[data-paid]',b);sync()}});
    sh.addEventListener('input',sync);sh.addEventListener('change',sync);sync();
    if(!editing)setTimeout(()=>$('#f-amount').focus(),150);
    $('#txf').onsubmit=e=>{e.preventDefault();
      const amount=parseMoney($('#f-amount').value);if(!(amount>0)){$('#f-amount').focus();toast('Informe um valor maior que zero');return}
      const date=$('#f-date').value||TODAY,desc=$('#f-desc').value.trim(),note=$('#f-note').value.trim();
      const cr=f.type==='out'&&f.method==='credito';
      if(cr&&!CC().length){toast('Cadastre um cartão de crédito primeiro');return}
      if(editing){
        Object.assign(t,{amount,desc,note,date,catId:f.catId,sub:f.sub||''});
        if(cr){const c=cardById(grouped?t.card:$('#f-card').value);t.method='credito';t.card=c.id;t.inv=addM(invOf(c,date),(t.inst?t.inst.n:1)-1);t.paid=true}
        else{t.method=f.method;t.accountId=$('#f-acc').value;t.paid=f.paid;if(!grouped){t.card='';t.inv='';t.inst=null}}
        return done('Salvo')}
      const base={type:f.type,desc,note,catId:f.catId,sub:f.sub||'',method:f.method};
      if(cr){const c=cardById($('#f-card').value);const n=Math.max(1,Math.min(48,parseInt($('#f-n').value)||1));const g=n>1?uid():null;const per=Math.floor(amount/n);

        S.demo=S.demo;M=invOf(c,date);return done(n>1?`Compra em ${n}x adicionada`:'Compra no cartão adicionada')}
      const n=Math.max(1,Math.min(60,parseInt($('#f-rep').value)||1));const g=n>1?uid():null;
      for(let i=0;i<n;i++)S.tx.push({...base,id:uid(),amount,date:dayIn(addM(ymOf(date),i),+date.slice(8)),accountId:$('#f-acc').value,card:'',inv:'',inst:null,group:g,paid:i===0?f.paid:false});
      M=ymOf(date);done(n>1?`Lançado por ${n} meses`:(f.type==='in'?'Entrada adicionada':'Gasto adicionado'))};
    if(editing){$('#del1').onclick=e=>armDanger(e.currentTarget,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);done('Excluído')});
      const da=$('#delAll');if(da)da.onclick=e=>armDanger(e.currentTarget,()=>{S.tx=S.tx.filter(x=>x.group!==t.group);done('Excluídos')})}
  })}

function canBuySheet(){let mode='vista';
  openSheet(`<h3>Posso comprar isso?</h3><form class="form" id="cbf" novalidate>
    <div class="field amount"><label for="cb-v">Quanto custa</label><input id="cb-v" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>
    <div class="field"><label for="cb-d">O que é</label><input id="cb-d" placeholder="Ex.: fone de ouvido" autocomplete="off"></div>
    <div class="field"><label for="cb-c">Categoria</label>${sel('cb-c',catsOf('out').map(c=>[c.id,c.name]),(catsOf('out').find(c=>c.name==='Compras')||catsOf('out')[0]||{}).id)}</div>
    <div class="seg" role="group"><button type="button" data-m="vista" aria-pressed="true">À vista (Pix/débito)</button><button type="button" data-m="cartao" aria-pressed="false" ${CC().length?'':'disabled'}>No cartão</button></div>
    <div class="two" id="cb-cw" hidden><div class="field"><label for="cb-k">Cartão</label>${sel('cb-k',CC().map(c=>[c.id,c.name]),(CC()[0]||{}).id)}</div><div class="field"><label for="cb-n">Parcelas</label><input id="cb-n" type="number" min="1" max="48" value="1" inputmode="numeric"></div></div>
    <div id="cb-out"></div></form>`,sh=>{const $=s=>sh.querySelector(s);
    const calc=()=>{const v=parseMoney($('#cb-v').value);const out=$('#cb-out');if(!(v>0)){out.innerHTML='<p class="hint">Digite o valor para ver a análise.</p>';return}
      const o=outlook(),cat=$('#cb-c').value,by=catSpend(CM),bud=S.plan.budgets[cat];const reasons=[];let level=0;
      if(mode==='vista'){const after=o.livre-v;const pd=Math.max(0,after)/o.daysLeft;
        reasons.push(`Sobra do mês: ${fmt(o.livre)} → <b>${fmt(after)}</b> depois da compra.`);
        reasons.push(`Gasto diário possível: ${fmt(o.perDay)} → <b>${fmt(Math.floor(Math.min(pd,o.byLimit!=null?Math.max(0,o.byLimit*o.daysLeft-v)/o.daysLeft:pd)))}</b>.`);
        if(after<0){level=2;reasons.push('Faltaria dinheiro para as contas do mês.')}else if(pd<o.perDay*.5)level=Math.max(level,1);
        if(S.plan.limit&&o.spent+v>S.plan.limit){level=Math.max(level,1);reasons.push(`Passa do seu limite mensal de ${fmt(S.plan.limit)}.`)}
      }else{const c=cardById($('#cb-k').value);const n=Math.max(1,Math.min(48,+$('#cb-n').value||1));const parc=Math.ceil(v/n);const avail=c.limit-cardUsed(c);const k=invOf(c,TODAY);const surplus=avgSurplus();
        reasons.push(`Limite disponível: ${fmt(avail)}${avail<v?' — <b class="neg">não cabe</b>':''}.`);
        reasons.push(`${n>1?n+'x de '+fmt(parc):fmt(v)} a partir da fatura de ${monthName(k)} (vence ${dShort(invDates(c,k).due)}).`);
        reasons.push(`Fatura de ${monthName(k)} iria de ${fmt(invTotal(c.id,k))} para <b>${fmt(invTotal(c.id,k)+parc)}</b>.`);
        reasons.push(`Sua sobra média por mês é ${fmt(surplus)}.`);
        if(avail<v){level=2}else if(parc>surplus){level=2;reasons.push('A parcela é maior do que você costuma sobrar por mês.')}else if(parc>surplus*.5){level=1;reasons.push('A parcela come mais da metade da sua sobra mensal.')}
        if(k===CM&&parc>o.livre){level=2;reasons.push('A fatura deste mês ficaria maior do que o dinheiro livre.')}}
      if(bud){const after=(by[cat]||0)+(mode==='vista'?v:0);if(after>bud){level=Math.max(level,1);reasons.push(`Estoura o limite de ${esc(catById(cat).name)} (${fmt(bud)}).`)}}
      const V=[['v-ok','check','Pode comprar','Cabe no seu orçamento.'],['v-mid','alert','Com cuidado','Dá, mas aperta o mês.'],['v-no','x','Melhor não agora','Pode te levar ao vermelho.']][level];
      out.innerHTML=`<div class="verdict ${V[0]}"><div class="vh"><i>${ic(V[1],20,3)}</i><span>${V[2]}<div class="sub" style="font-family:var(--font-ui);font-weight:600;font-size:13px">${V[3]}</div></span></div><ul>${reasons.map(r=>`<li>${r}</li>`).join('')}</ul></div>
       <div class="btns" style="margin-top:12px"><button type="button" class="btn ${level===2?'ghost':''}" id="cb-reg">${ic('plus',18)}Registrar compra</button></div>`;
      $('#cb-reg').onclick=()=>{const pre={type:'out',amount:v,desc:$('#cb-d').value.trim(),catId:cat};if(mode==='cartao'){pre.method='credito';pre.card=$('#cb-k').value;pre.n=Math.max(1,+$('#cb-n').value||1)}else pre.method='pix';txForm(null,pre)}};
    sh.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;pressGroup(sh,'[data-m]',b);$('#cb-cw').hidden=mode!=='cartao';calc()});
    sh.addEventListener('input',calc);sh.addEventListener('change',e=>{if(e.target.tagName==='SELECT')calc()});$('#cbf').onsubmit=e=>e.preventDefault();calc();setTimeout(()=>$('#cb-v').focus(),150)})}

function importData(){openSheet(`<h3>Restaurar backup</h3><form class="form" id="imf">

    sh.querySelector('#imf').onsubmit=e=>{e.preventDefault();const f=sh.querySelector('#im-file').files[0];if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else apply(sh.querySelector('#im-text').value)}})}

  S.transfers=S.transfers||[];S.incomes=S.incomes||[];S.cards.forEach(c=>{if(!c.kind)c.kind='credito'});S.cats.forEach(c=>{if(!c.subs)c.subs=[]});if(!S.settings.user)S.settings.user={name:'',photo:''};

  S.tx.push({id:uid(),type:'in',amount:r.amount,desc:r.name,catId:r.catId||(catsOf('in')[0]||{}).id||'',date:dayIn(CM,r.day),method:'transf',accountId:r.accountId,card:'',inv:'',inst:null,group:null,paid:false,note:'',src:r.id})}if(ch)save()}

function nextIncome(r){const d=dayIn(CM,r.day);return d<TODAY?dayIn(addM(CM,1),r.day):d}
function fitNext(){const cc=CC();if(!cc.length)return null;
  const renda=S.incomes.length?S.incomes.reduce((s,r)=>s+r.amount,0):Math.round([1,2,3].reduce((s,k)=>s+monthIn(addM(CM,-k)).total,0)/3);
  const fixos=Math.round([1,2,3].reduce((s,k)=>s+monthOut(addM(CM,-k)).items.reduce((x,t)=>x+t.amount,0),0)/3);
  const fat=k=>cc.reduce((s,c)=>s+invTotal(c.id,k),0);const K=addM(CM,1);
  const avail=cc.reduce((s,c)=>s+Math.max(0,c.limit-cardUsed(c)),0);
  const cabe=Math.max(0,Math.min(renda-fixos-fat(K),avail));
  let parc=Infinity;for(let i=1;i<=6;i++)parc=Math.min(parc,renda-fixos-fat(addM(CM,i)));parc=Math.max(0,Math.min(parc,avail));
  let best=null,bd='';cc.forEach(c=>{const d=invDates(c,invOf(c,TODAY)).due;if(d>bd){bd=d;best=c}});
  return{renda,fixos,fatK:fat(K),K,avail,cabe,parc,best,bd,hasInc:S.incomes.length>0}}

  <section><div class="sec-h"><h2>Suas contas</h2><span class="sub">Toque para ver o extrato</span></div>
   <div class="panel list">${accs.map(({a,b})=>`<button type="button" class="row" data-act="extrato" data-id="${a.id}"><span class="sq" style="background:${a.color};color:${inkOn(a.color)}">${esc(a.bank&&a.bank!=='outro'?bankBy(a.bank)[2]:a.name.slice(0,2))}</span><span class="main"><span class="t">${esc(a.name)}</span><span class="s">${ACC_KINDS[a.kind]||''}${a.include===false?' · fora do total':''}</span></span><span class="amt"><span class="num ${b<0?'neg':''}">${fmt(b)}</span><span class="s muted" style="font-size:12px">${a.include===false?'—':pct(b)+'% do total'}</span></span></button>`).join('')}</div></section>
  <section><div class="panel pad" style="display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:12px"><span class="cico" style="background:color-mix(in srgb,var(--in) 16%,transparent);color:var(--in)">${ic('trend',22)}</span><div style="flex:1;min-width:0"><b style="font-family:var(--font-num);font-size:19px">Minhas rendas</b><div class="sub">${S.incomes.length} fonte${S.incomes.length===1?'':'s'} · ${fmt(incTot)}/mês</div></div><button type="button" class="link" data-act="newinc">Nova ${ic('plus',16,2.4)}</button></div>
    ${nx?`<div style="display:flex;justify-content:space-between;gap:10px;background:var(--raised);border-radius:14px;padding:12px 14px;font-size:14px"><span class="muted" style="display:flex;gap:8px;align-items:center;min-width:0">${ic('cal',18)}Próximo: ${esc(nx.r.name)} · ${dShort(nx.d)}</span><b class="num">${fmt(nx.r.amount)}</b></div>`:'<p class="hint">Cadastre salário e outras rendas fixas. Todo mês o app lança a entrada como "a receber" e lembra você de confirmar.</p>'}
    ${S.incomes.length?`<div class="list">${S.incomes.map(r=>`<button type="button" class="row" style="padding-inline:0" data-act="editinc" data-id="${r.id}"><span class="main"><span class="t">${esc(r.name)}</span><span class="s">Todo dia ${r.day} · ${esc((accById(r.accountId)||{name:'—'}).name)}</span></span><span class="num" style="font-weight:700">${fmt(r.amount)}</span>${ic('right',18)}</button>`).join('')}</div>`:''}
  </div></section>

function reminders(){const out=[];const days=d=>Math.round((new Date(d+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
  const when=n=>n<0?`Venceu há ${-n} dia${n<-1?'s':''}`:n===0?'Vence hoje':`Vence em ${n} dia${n>1?'s':''}`;
  for(const c of CC())cardKeys(c).forEach(k=>{if(invPaid(c.id,k))return;const tot=invTotal(c.id,k);if(!tot)return;const n=days(invDates(c,k).due);if(n<=5)out.push({i:'card',col:n<0?'var(--out)':'var(--warn)',t:'Fatura '+c.name,s:when(n),v:tot,act:`data-act="invoice" data-card="${c.id}" data-k="${k}"`})});
  for(const t of S.tx){if(t.paid||isCredit(t))continue;const n=days(t.date);const a=`data-act="edit" data-id="${t.id}"`;
    if(t.type==='out'&&n<=3)out.push({i:'receipt',col:n<0?'var(--out)':'var(--warn)',t:t.desc||catById(t.catId).name,s:when(n),v:t.amount,act:a});
    if(t.type==='in'&&n<=0)out.push({i:'trend',col:'var(--in)',t:t.desc||'Entrada',s:'Confirme se você já recebeu',v:t.amount,act:a})}
  const by=catSpend(CM);for(const id in S.plan.budgets){const b=S.plan.budgets[id],v=by[id]||0;if(b>0&&v>=b*.9)out.push({i:'alert',col:v>b?'var(--out)':'var(--warn)',t:'Limite de '+catById(id).name,s:v>b?'Limite estourado':Math.round(v/b*100)+'% do limite usado',v,act:'data-act="plan"'})}
  return out}
const remRow=r=>`<button type="button" class="row" ${r.act}><span class="bub" style="background:color-mix(in srgb,${r.col} 18%,transparent);color:${r.col}">${ic(r.i,20)}</span><span class="main"><span class="t">${esc(r.t)}</span><span class="s" style="color:${r.col}">${r.s}</span></span><span class="num" style="font-weight:700">${fmt(r.v)}</span></button>`;

  S.transfers.forEach(tr=>{if(tr.from!==id&&tr.to!==id)return;const inn=tr.to===id;const o=accById(inn?tr.from:tr.to)||{name:'—'};
    rows.push({d:tr.date,h:`<button type="button" class="row" data-act="edittr" data-id="${tr.id}"><span class="bub" style="background:var(--raised);color:var(--muted)">${ic('swap',20)}</span><span class="main"><span class="t">${inn?'Recebido de':'Enviado para'} ${esc(o.name)}</span><span class="s">Transferência · ${dNum(tr.date)}</span></span><span class="num ${inn?'pos':''}" style="font-weight:700">${inn?'+ ':'− '}${fmt(tr.amount)}</span></button>`})});
  for(const k in S.paidInv){const p=S.paidInv[k];if(!p||p.acc!==id)continue;const i=k.indexOf('|');const c=cardById(k.slice(0,i));if(!c)continue;const m=k.slice(i+1);

  rows.sort((x,y)=>x.d<y.d?1:-1);
  openSheet(`<h3>${esc(a.name)}</h3><div class="panel pad" style="margin-bottom:12px"><div class="lbl">Saldo atual</div><div class="big num" style="margin-top:6px">${fmt(accBalance(a))}</div></div>
   <div class="btns" style="margin-bottom:14px"><button type="button" class="btn ghost" data-act="transfer" data-id="${id}">${ic('swap',18)}Transferir</button><button type="button" class="btn ghost" data-act="editacc" data-id="${id}">${ic('edit',18)}Editar</button></div>
   <div class="panel list">${rows.length?rows.slice(0,60).map(r=>r.h).join(''):'<div class="empty">Nenhuma movimentação nesta conta.</div>'}</div>`)}
function transferForm(tr,fromId){const editing=!!tr;if(S.accounts.length<2){toast('Você precisa de pelo menos duas contas');return}
  const d=tr||{from:fromId||S.accounts[0].id,to:(S.accounts.find(a=>a.id!==(fromId||S.accounts[0].id))||{}).id,amount:0,date:TODAY};const opts=S.accounts.map(a=>[a.id,a.name]);
  openSheet(`<h3>${editing?'Editar transferência':'Transferir entre contas'}</h3><form class="form" id="trf" novalidate>
    <div class="field amount"><label for="t-v">Valor</label><input id="t-v" inputmode="decimal" placeholder="0,00" value="${d.amount?toInput(d.amount):''}" autocomplete="off"></div>
    <div class="two"><div class="field"><label for="t-from">De</label>${sel('t-from',opts,d.from)}</div><div class="field"><label for="t-to">Para</label>${sel('t-to',opts,d.to)}</div></div>
    <div class="field"><label for="t-d">Data</label><input id="t-d" type="date" value="${d.date}"></div>
    <div class="btns"><button class="btn" type="submit">${editing?'Salvar':'Transferir'}</button></div>
    ${editing?`<div class="btns"><button type="button" class="btn danger" id="trdel">${ic('trash',18)}Excluir transferência</button></div>`:''}</form>`,sh=>{const $=s=>sh.querySelector(s);
    $('#trf').onsubmit=e=>{e.preventDefault();const amount=parseMoney($('#t-v').value),from=$('#t-from').value,to=$('#t-to').value;
      if(!(amount>0)){toast('Informe um valor maior que zero');return}if(from===to){toast('Escolha contas diferentes');return}
      const o={from,to,amount,date:$('#t-d').value||TODAY};if(editing)Object.assign(tr,o);else S.transfers.push({id:uid(),...o});done(editing?'Transferência salva':'Transferência registrada')};
    if(editing)$('#trdel').onclick=e=>armDanger(e.currentTarget,()=>{S.transfers=S.transfers.filter(x=>x.id!==tr.id);done('Transferência excluída')})})}
function incomeForm(r){const editing=!!r;const cats=catsOf('in');
  openSheet(`<h3>${editing?'Editar renda':'Nova renda'}</h3><form class="form" id="rf" novalidate>
    <div class="field"><label for="r-n">Nome</label><input id="r-n" placeholder="Ex.: Salário" value="${esc(r?r.name:'')}" maxlength="28"></div>
    <div class="two"><div class="field"><label for="r-v">Valor por mês</label><input id="r-v" inputmode="decimal" placeholder="0,00" value="${r?toInput(r.amount):''}"></div><div class="field"><label for="r-d">Dia que cai</label><input id="r-d" type="number" min="1" max="31" inputmode="numeric" value="${r?r.day:5}"></div></div>
    <div class="two"><div class="field"><label for="r-a">Conta</label>${sel('r-a',S.accounts.map(a=>[a.id,a.name]),r?r.accountId:(S.accounts[0]||{}).id)}</div><div class="field"><label for="r-c">Categoria</label>${sel('r-c',cats.map(c=>[c.id,c.name]),r?r.catId:(cats[0]||{}).id)}</div></div>
    <p class="hint">Todo mês a entrada é lançada como "a receber". Quando o dinheiro cair, confirme no lembrete.</p>
    <div class="btns"><button class="btn" type="submit">${editing?'Salvar':'Adicionar renda'}</button></div>
    ${editing?`<div class="btns"><button type="button" class="btn danger" id="rdel">${ic('trash',18)}Excluir renda</button></div>`:''}</form>`,sh=>{const $=s=>sh.querySelector(s);
    $('#rf').onsubmit=e=>{e.preventDefault();const name=$('#r-n').value.trim(),amount=parseMoney($('#r-v').value);if(!name||!(amount>0)){toast('Preencha o nome e o valor');return}
      const o={name,amount,day:Math.max(1,Math.min(31,parseInt($('#r-d').value)||1)),accountId:$('#r-a').value,catId:$('#r-c').value};
      if(editing){Object.assign(r,o);S.tx.forEach(t=>{if(t.src===r.id&&!t.paid&&ymOf(t.date)===CM)Object.assign(t,{amount,desc:name,date:dayIn(CM,o.day),accountId:o.accountId,catId:o.catId})})}else S.incomes.push({id:'r_'+uid(),...o});
      ensureIncomes();done(editing?'Renda salva':'Renda adicionada')};
    if(editing)$('#rdel').onclick=e=>armDanger(e.currentTarget,()=>{S.tx=S.tx.filter(t=>!(t.src===r.id&&!t.paid));S.incomes=S.incomes.filter(x=>x.id!==r.id);done('Renda excluída')})})}
function allInvoicesSheet(){let h='';for(let k=4;k>=-3;k--){const m=addM(CM,k);const inv=invoicesDue(m);if(!inv.length)continue;h+=`<div class="blockh" style="font-size:16px;margin-top:14px">${monthLong(m)}${m===CM?' <span class="st ac">este mês</span>':''}</div><div class="panel list">${inv.map(invRow).join('')}</div>`}
  openSheet(`<h3>Faturas dos cartões</h3>${h||'<div class="panel empty">Nenhuma fatura registrada.</div>'}`)}

/* ----- perfil e preferências ----- */
function profileSheet(){const u=S.settings.user;let photo=u.photo||'';
  openSheet(`<h3>Editar perfil</h3><form class="form" id="pff" novalidate>
    <div style="display:flex;align-items:center;gap:14px"><span id="pf-av">${avatarHtml()}</span><div style="display:flex;flex-direction:column;gap:8px"><label class="act" style="cursor:pointer;position:relative;overflow:hidden">${ic('camera',18)}Escolher foto<input type="file" id="pf-file" accept="image/*" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label><button type="button" class="link" id="pf-rm" ${photo?'':'hidden'}>Remover foto</button></div></div>
    <div class="field"><label for="pf-n">Seu nome</label><input id="pf-n" value="${esc(u.name||'')}" maxlength="24" placeholder="Como quer ser chamado"></div>
    <div class="field"><label for="appname2">Nome do app</label><input id="appname2" value="${esc(S.settings.name)}" maxlength="24"><p class="hint">Aparece no topo do Início.</p></div>
    <div class="btns"><button class="btn" type="submit">Salvar</button></div></form>`,sh=>{const $=s=>sh.querySelector(s);
    const pv=()=>{$('#pf-av').innerHTML=photo?`<img class="avatar" src="${photo}" alt="">`:avatarHtml();$('#pf-rm').hidden=!photo};
    $('#pf-file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const z=160,cv=document.createElement('canvas');cv.width=cv.height=z;const m=Math.min(img.width,img.height);cv.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,z,z);photo=cv.toDataURL('image/jpeg',.82);pv()};img.onerror=()=>toast('Não consegui abrir essa imagem');img.src=rd.result};rd.readAsDataURL(f)};
    $('#pf-rm').onclick=()=>{photo='';S.settings.user.photo='';pv()};
    $('#pff').onsubmit=e=>{e.preventDefault();S.settings.user={name:$('#pf-n').value.trim(),photo};S.settings.name=$('#appname2').value.trim()||'Caixa';done('Perfil salvo')}})}
function catsSheet(){openSheet(`<h3>Categorias</h3>${['out','in'].map(tp=>`<p class="grp" style="margin:14px 0 8px">${tp==='out'?'Gastos':'Entradas'}</p><div class="panel cfg">${catsOf(tp).map(c=>`<button type="button" class="cfgrow" data-act="editcat" data-id="${c.id}">${bub(c,36)}<span class="n"><b>${esc(c.name)}</b><small>${[(c.subs||[]).length?(c.subs.length+' subcategoria'+(c.subs.length>1?'s':'')):'',S.plan.budgets[c.id]?'limite '+fmt(S.plan.budgets[c.id]):''].filter(Boolean).join(' · ')}</small></span>${ic('right',18)}</button>`).join('')}</div>`).join('')}<div class="btns" style="margin-top:14px"><button type="button" class="btn" data-act="newcat">${ic('plus',18)}Nova categoria</button></div>`)}
function subsSheet(cid){const cur=catById(cid||(S.cats[0]||{}).id);
  openSheet(`<h3>Subcategorias</h3><form class="form" id="sbf" novalidate>
    <div class="field"><label for="sb-c">Categoria</label>${sel('sb-c',S.cats.map(c=>[c.id,(c.type==='out'?'Gasto · ':'Entrada · ')+c.name]),cur.id)}</div>
    <div class="subline">${(cur.subs||[]).length?cur.subs.map((x,i)=>`<span class="x">${esc(x)}<button type="button" data-rm="${i}" aria-label="Remover ${esc(x)}">${ic('x',14,2.4)}</button></span>`).join(''):'<span class="hint">Nenhuma subcategoria nesta categoria.</span>'}</div>
    <div class="field"><label for="sb-n">Nova subcategoria</label><input id="sb-n" placeholder="Ex.: Feira, Combustível" maxlength="22" autocomplete="off"></div>
    <div class="btns"><button class="btn" type="submit">${ic('plus',18)}Adicionar</button></div></form>`,sh=>{const $=s=>sh.querySelector(s);
    $('#sb-c').onchange=e=>subsSheet(e.target.value);
    sh.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cur.subs.splice(+b.dataset.rm,1);save();subsSheet(cur.id)});
    $('#sbf').onsubmit=e=>{e.preventDefault();const v=$('#sb-n').value.trim();if(!v)return;cur.subs=cur.subs||[];if(cur.subs.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Já existe');return}cur.subs.push(v);save();subsSheet(cur.id);toast('Subcategoria adicionada')}})}
function currencySheet(){openSheet(`<h3>Moeda</h3><div class="panel cfg">${CURS.map(([k,l])=>`<button type="button" class="cfgrow" data-act="setcur" data-v="${k}"><span class="n"><b>${l}</b><small>${k}</small></span>${S.settings.currency===k?`<span style="color:var(--accent-text)">${ic('check',22,2.6)}</span>`:''}</button>`).join('')}</div><p class="hint" style="margin-top:10px">Muda só o símbolo e o formato. Os valores não são convertidos.</p>`)}
function colorSheet(){const st=S.settings;const custom=!ACCENTS.some(c=>c.toLowerCase()===st.accent.toLowerCase());
  openSheet(`<h3>Cor do app</h3><div class="swatches" style="gap:12px">${ACCENTS.map(c=>`<button type="button" data-act="accent" data-v="${c}" style="background:${c};width:48px;height:48px;border-radius:16px" aria-label="Cor ${c}" aria-pressed="${st.accent.toLowerCase()===c.toLowerCase()}"></button>`).join('')}<label title="Outra cor" style="width:48px;height:48px;border-radius:16px;${custom?`background:${st.accent};border-style:solid;border-color:var(--ink)`:''}">${ic('plus',18)}<input type="color" id="accentpick" value="${st.accent}" aria-label="Escolher outra cor"></label></div>
   <p class="hint" style="margin-top:12px">O último botão abre o seletor para qualquer cor.</p><div class="btns" style="margin-top:14px"><button type="button" class="btn" id="col-ok">Pronto</button></div>`,sh=>{sh.querySelector('#col-ok').onclick=()=>closeSheet()})}
function homeSheet(){const st=S.settings;
  openSheet(`<h3>Tela inicial</h3><p class="hint" style="margin-bottom:10px">Escolha o que aparece e em que ordem.</p><div class="panel cfg">${st.home.map((x,k)=>{const lab=(HOME.find(h=>h[0]===x.id)||[])[1];return `<div class="cfgrow"><span class="n"><b>${lab}</b></span><span class="tools"><button type="button" data-act="hmove" data-i="${k}" data-d="-1" ${k===0?'disabled':''} aria-label="Subir">${ic('up',18)}</button><button type="button" data-act="hmove" data-i="${k}" data-d="1" ${k===st.home.length-1?'disabled':''} aria-label="Descer">${ic('down',18)}</button></span><input type="checkbox" class="toggle" data-home="${x.id}" ${x.on?'checked':''} aria-label="Mostrar ${lab}"></div>`}).join('')}</div>
   <div class="btns" style="margin-top:14px"><button type="button" class="btn" id="hm-ok">Pronto</button></div>`,sh=>{sh.querySelector('#hm-ok').onclick=()=>{closeSheet();render()}})}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){page=null;tab=tb.dataset.tab;if(tab!=='gastos'){gstatus='all';gmethod=null}render();window.scrollTo(0,0);return}
  const a=e.target.closest('[data-act]');if(!a)return;const v=a.dataset.v;
  switch(a.dataset.act){
    case 'prev':M=addM(M,-1);render();break;
    case 'next':M=addM(M,1);render();break;
    case 'new':txForm(null,{type:tab==='gastos'&&gmode==='in'?'in':'out'});break;
    case 'newin':txForm(null,{type:'in',method:'pix'});break;
    case 'newon':txForm(null,{type:'out',method:'credito',card:a.dataset.card});break;
    case 'edit':{const t=S.tx.find(x=>x.id===a.dataset.id);if(t)txForm(t);break}
    case 'invoice':invoiceSheet(a.dataset.card,a.dataset.k);break;
    case 'hide':S.settings.hide=!S.settings.hide;save();render();break;
    case 'go':closeSheet(true);page=null;tab=a.dataset.to;M=CM;render();window.scrollTo(0,0);break;
    case 'gostatus-all':case 'gostatus-paid':case 'gostatus-open':page=null;tab='gastos';gmode='out';M=CM;gmethod=null;gstatus=a.dataset.act.split('-')[1];render();window.scrollTo(0,0);break;
    case 'goin':page=null;tab='gastos';gmode='in';M=CM;gstatus='all';gmethod=null;render();window.scrollTo(0,0);break;
    case 'gmode':gmode=v;gstatus='all';gmethod=null;gcat='';gacc='';render();break;
    case 'gstatus':gstatus=(gstatus===v&&v!=='all')?'all':v;gmethod=null;render();break;
    case 'gmethod':gmethod=gmethod===v?null:v;gstatus='all';render();break;
    case 'sort':gsort={recent:'value',value:'due',due:'recent'}[gsort];render();break;
    case 'filters':filterSheet();break;
    case 'catfilter':page=null;tab='gastos';gmode='out';gcat=a.dataset.id;gstatus='all';gmethod=null;render();window.scrollTo(0,0);break;
    case 'plan':planSheet();break;
    case 'canbuy':canBuySheet();break;
    case 'newgoal':goalForm(null);break;
    case 'editgoal':goalForm(S.plan.goals.find(g=>g.id===a.dataset.id));break;
    case 'accounts':page='contas';ptab='contas';render();window.scrollTo(0,0);break;
    case 'newacc':accForm(null);break;
    case 'editacc':accForm(accById(a.dataset.id));break;
    case 'cards':page='contas';ptab='cartoes';pkind='credito';render();window.scrollTo(0,0);break;
    case 'newcard':cardForm(null);break;
    case 'editcard':cardForm(cardById(a.dataset.id));break;
    case 'newcat':catForm(null,'out');break;
    case 'editcat':catForm(catById(a.dataset.id));break;
    case 'theme':S.settings.theme=v;save();render();break;
    case 'accent':S.settings.accent=v;save();render();colorSheet();break;
    case 'hmove':{const i=+a.dataset.i,d=+a.dataset.d,h=S.settings.home;const j=i+d;if(j<0||j>=h.length)break;[h[i],h[j]]=[h[j],h[i]];save();render();homeSheet();break}
    case 'cleardemo':S=defaults();save();M=CM;render();toast('Tudo limpo. Comece pelas contas e cartões em Config.');break;
    case 'loaddemo':armDanger(a,()=>{S=seed();save();M=CM;render();toast('Exemplos carregados')});break;
    case 'back':page=null;render();window.scrollTo(0,0);break;
    case 'ptab':ptab=v;render();break;
    case 'pkind':pkind=v;render();break;
    case 'pick':psel=a.dataset.id;render();break;
    case 'extrato':extratoSheet(a.dataset.id);break;
    case 'transfer':transferForm(null,a.dataset.id);break;
    case 'edittr':transferForm(S.transfers.find(x=>x.id===a.dataset.id));break;
    case 'newinc':incomeForm(null);break;
    case 'editinc':incomeForm(S.incomes.find(x=>x.id===a.dataset.id));break;
    case 'allinv':allInvoicesSheet();break;
    case 'reminders':remindersSheet();break;
    case 'profile':profileSheet();break;
    case 'catsheet':catsSheet();break;
    case 'subsheet':subsSheet(a.dataset.id);break;
    case 'currency':currencySheet();break;
    case 'setcur':S.settings.currency=v;done('Moeda alterada');break;
    case 'color':colorSheet();break;
    case 'homecfg':homeSheet();break;
    case 'export':exportData();break;
    case 'import':importData();break;
    case 'wipe':armDanger(a,()=>{S=defaults();save();render();toast('Dados apagados')});break;
  }});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='gq'){gq=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('gq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  if(id==='accentpick'){S.settings.accent=e.target.value;applyTheme()}
});
document.addEventListener('change',e=>{const el=e.target,id=el.id;
  if(id==='accentpick'){S.settings.accent=el.value;save();render();colorSheet()}
  else if(id==='appname'){S.settings.name=el.value.trim()||'Caixa';save();toast('Nome salvo')}
  else if(id==='hidevals'){S.settings.hide=el.checked;save();render()}
  else if(id==='darkmode'){S.settings.theme=el.checked?'dark':'light';save();render()}
  else if(id==='remtog'){S.settings.reminders=el.checked;save();render()}
  else if(id==='hl'){S.settings.highlight=el.value;save();toast('Destaque salvo')}
  else if(el.dataset&&el.dataset.home){const x=S.settings.home.find(h=>h.id===el.dataset.home);if(x){x.on=el.checked;save()}}
});
if(window.matchMedia)matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.settings.theme==='system')applyTheme()});

load();render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
</body>
</html>
