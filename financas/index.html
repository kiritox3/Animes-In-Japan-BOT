function quickParse(raw){const t=raw.trim();if(!t)return null;const low=t.toLowerCase();
  const m=low.match(/r\$\s?([\d.]+,\d{1,2}|[\d.]+)|\b(\d+(?:[.,]\d{1,2})?)\s*(?:reais|real|conto|pila)?\b/);if(!m)return null;
  const amount=Math.abs(parseMoney(m[1]||m[2]));if(!(amount>0))return null;
  const type=/\b(recebi|ganhei|caiu|entrou|sal[aá]rio|me pagaram|me pagou|vendi)\b/.test(low)?'in':'out';
  let date=TODAY;if(/\banteontem\b/.test(low))date=addD(TODAY,-2);else if(/\bontem\b/.test(low))date=addD(TODAY,-1);
  const dm=low.match(/\b(\d{1,2})\/(\d{1,2})\b/);if(dm){const d=TODAY.slice(0,4)+'-'+pad(dm[2])+'-'+pad(dm[1]);if(!isNaN(new Date(d+'T12:00'))&&d<=TODAY)date=d}
  let method=type==='in'?'pix':'pix';if(/cr[eé]dito|cart[aã]o|parcel|\d+\s*x\b|vezes/.test(low))method='credito';if(/d[eé]bito/.test(low))method='debito';if(/dinheiro|esp[eé]cie/.test(low))method='dinheiro';if(/boleto/.test(low))method='boleto';if(/\bpix\b/.test(low))method='pix';
  const nm=low.match(/(?:em\s+)?(\d{1,2})\s*(?:x|vezes)\b/);const n=nm&&method==='credito'?Math.max(1,Math.min(48,+nm[1])):1;
  let card='',accountId='';const nameHit=list=>list.find(x=>low.includes(x.name.toLowerCase())||(x.bank&&bankBy(x.bank)&&low.includes(bankBy(x.bank)[1].toLowerCase())));
  if(method==='credito'){const c=nameHit(CC())||CC()[0];if(c)card=c.id;else method='debito'}else{const a=nameHit(S.accounts);if(a)accountId=a.id}
  let catId='';const cats=catsOf(type);const byName=cats.find(c=>low.includes(c.name.toLowerCase()));if(byName)catId=byName.id;
  let desc='';const dx=t.match(/\b(?:no|na|em|com|de|do|da|pro|pra|para)\s+([A-Za-zÀ-ú0-9][^,.;]*?)(?=\s+(?:no|na|em|com|ontem|hoje|anteontem|pelo|pela|via|no pix|no cr[eé]dito|no d[eé]bito|em \d|\d+x)\b|[,.;]|$)/i);
  if(dx){desc=dx[1].replace(/\b(pix|cr[eé]dito|d[eé]bito|dinheiro|cart[aã]o|nubank|picpay|inter|ontem|hoje)\b/gi,'').replace(/\s+/g,' ').trim()}
  if(!desc){desc=t.replace(m[0],'').replace(/\b(gastei|paguei|comprei|recebi|ganhei|reais|real|ontem|hoje|anteontem|no|na|em|com|de|pix|cr[eé]dito|d[eé]bito)\b/gi,' ').replace(/\s+/g,' ').trim()}
  desc=desc.slice(0,40);if(desc)desc=desc.charAt(0).toUpperCase()+desc.slice(1);
  if(!catId&&type==='out'){const hit=(CAT_WORDS.find(([,r])=>r.test(desc+' '+low))||[])[0];const c=hit&&cats.find(c=>c.name===hit);if(c)catId=c.id}
  if(!catId){const prev=desc&&S.tx.slice().reverse().find(x=>x.type===type&&x.desc&&x.desc.toLowerCase()===desc.toLowerCase());if(prev)catId=prev.catId}
  return{type,amount,desc,date,method,card,accountId,catId,n}}

const ANS=[['resumo','Resumo do mês'],['destaques','Destaques do mês'],['onde','Para onde foi seu dinheiro'],['origem','De onde vem seu dinheiro'],['seis','Últimos 6 meses'],['semana','Gastos dos últimos 7 dias'],['projecao','Projeção do mês'],['compromissos','Compromissos do mês'],['comparacao','Comparação mensal'],['dia','Gasto por dia'],['forma','Forma de pagamento'],['faturas','Faturas do mês'],['maiores','Maiores gastos'],['emprestimos','Empréstimos'],['saldos','Saldos das contas']];

function vAnalises(){

  if(locked)body+=lockedCard('analises',`Mais ${locked} análises no Premium`,'Projeção, últimos 7 dias, compromissos, comparação, formas de pagamento, faturas e mais.');
  body+=`<section><button type="button" class="act" data-act="anscfg" style="width:100%;border-style:dashed">${ic('filter',18)}Personalizar análises</button></section><p class="hint" style="text-align:center;margin-top:14px">Gastos no cartão entram no mês da fatura. Pagamentos de fatura, transferências entre suas contas e empréstimos não contam como gasto.</p>`;

const sec=(title,icn,inner,extra='')=>`<section><div class="panel pad"><div class="sec-h" style="margin-bottom:14px"><div style="display:flex;gap:12px;align-items:center"><span class="cico" style="background:var(--accent-soft);color:var(--accent-text)">${ic(icn,22)}</span><h2 style="font-size:calc(18px*var(--fs))">${title}</h2></div>${extra}</div>${inner}</div></section>`;
function aResumo(){const o=monthOut(M),i=monthIn(M),po=monthOut(addM(M,-1));const D=cutDay(M)||dim(M);
  const pmPaid=(()=>{const pm=addM(M,-1);let s=0;for(const t of S.tx)if(realOut(t)&&monthOfTx(t)===pm&&isPaidOut(t)&&+t.date.slice(8)<=D)s+=t.amount;return s})();
  const delta=pmPaid?Math.round((o.paid-pmPaid)/pmPaid*100):null,lim=S.plan.limit,lp=lim?Math.round(o.paid/lim*100):0;

   ${lim?`<div><div class="track" style="background:rgba(255,255,255,.2);height:10px"><i style="width:${Math.min(100,lp)}%;background:${lp>100?'#FFD86B':'#fff'}"></i></div><small style="opacity:.9">${lp}% do limite de ${fmt(lim)}</small></div>`:''}
   <div class="trio"><button type="button" data-act="goin"><i style="color:var(--in)">${ic('down',14,3)}</i><b class="num">${fmt(i.rec)}</b><small>Receitas</small></button><button type="button" data-act="gostatus-open"><i style="color:#b88300">${ic('clock',14,2.6)}</i><b class="num">${fmt(o.open)}</b><small>Pendentes</small></button><button type="button" data-act="go" data-to="inicio"><i style="color:var(--accent)">${ic('wallet',14,2.6)}</i><b class="num">${fmt(i.rec-o.paid)}</b><small>Sobra do mês</small></button></div></div></section>`}
function aDestaques(){const l=insights(M);return sec('Destaques do mês','sparkle',l.length?`<div class="inslist">${l.map(insightCard).join('')}</div>`:'<p class="hint">Ainda não há dados suficientes neste mês.</p>')}
function normDesc(s){return String(s||'Sem descrição').replace(/\*/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase())}
function aOnde(){const pm=addM(M,-1);const base=t=>realOut(t)&&monthOfTx(t)===M&&(!apaid||isPaidOut(t));
  const items=S.tx.filter(base);const key=t=>aview==='cat'?t.catId:normDesc(t.desc);
  const g={};items.forEach(t=>{const k=key(t);(g[k]=g[k]||{v:0,list:[]}).v+=t.amount;g[k].list.push(t)});
  const prevBy={};S.tx.forEach(t=>{if(realOut(t)&&monthOfTx(t)===pm&&(!apaid||isPaidOut(t))){const k=key(t);prevBy[k]=(prevBy[k]||0)+t.amount}});
  const ent=Object.entries(g).sort((a,b)=>b[1].v-a[1].v);const tot=ent.reduce((s,e)=>s+e[1].v,0);

    donut=`<svg viewBox="0 0 150 150" style="width:190px;height:190px;display:block;margin:6px auto 10px" role="img" aria-label="Gastos por ${aview==='cat'?'categoria':'estabelecimento'}"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--raised)" stroke-width="22"/>${arcs}<text x="75" y="70" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Manrope,system-ui">Total</text><text x="75" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Space Grotesk,system-ui">${S.settings.hide?'•••':brl.format(tot/100)}</text></svg>`}
  const rows=ent.slice(0,12).map(([k,o],i)=>{const c=aview==='cat'?catById(k):{name:k,color:colorOf(k,i),icon:'bag'};const pv=prevBy[k]||0,ch=pv?Math.round((o.v-pv)/pv*100):null;
    return `<details class="crow"><summary>${aview==='cat'?bub(c,44):`<span class="bub" style="width:44px;height:44px;background:color-mix(in srgb,${c.color} 20%,transparent);color:${c.color}">${ic('store',20)}</span>`}<span class="main"><b>${esc(c.name)}</b><small class="sub">${o.list.length} lançamento${o.list.length>1?'s':''} · ${Math.round(o.v/tot*100)}%</small></span><span class="amt"><b class="num">${fmt(o.v)}</b>${ch!=null&&Math.abs(ch)>=5?`<span class="st ${ch>0?'bad':'ok'}">${ch>0?'↑':'↓'} ${Math.abs(ch)}%</span>`:''}</span>${ic('down',18)}</summary>
     <div class="track" style="margin:8px 0 4px"><i style="width:${o.v/tot*100}%;background:${c.color}"></i></div><div class="list">${o.list.sort((a,b)=>b.amount-a.amount).map(txRow).join('')}</div></details>`}).join('');
  const tg=(v,cur,act,a,b,ia,ib)=>`<div class="seg" role="group" style="margin-bottom:10px"><button type="button" data-act="${act}" data-v="${a}" aria-pressed="${cur===a||cur===true&&a==='1'}">${ic(ia,18)}${v[0]}</button><button type="button" data-act="${act}" data-v="${b}" aria-pressed="${cur===b||cur===false&&b==='0'}">${ic(ib,18)}${v[1]}</button></div>`;
  return sec('Para onde foi seu dinheiro','grid',tg(['Por categoria','Por estabelecimento'],aview,'aview','cat','loja','grid','store')+
    `<div class="chips" style="margin-bottom:6px"><button type="button" data-act="apaid" data-v="1" aria-pressed="${apaid}" style="padding:7px 14px">${apaid?ic('check',14,3):''}Pagas</button><button type="button" data-act="apaid" data-v="0" aria-pressed="${!apaid}" style="padding:7px 14px">Todas as despesas</button></div>`+
    (tot?donut+`<p class="hint" style="margin-bottom:6px">${apaid?'Só despesas pagas':'Todas as despesas'} de ${monthName(M)}. As setas comparam com ${monthName(pm)}. Toque para ver os lançamentos.</p>`+rows:'<div class="empty">Sem despesas neste mês.</div>'))}
function aOrigem(){const items=S.tx.filter(t=>realIn(t)&&ymOf(t.date)===M&&t.paid);const tot=items.reduce((s,t)=>s+t.amount,0);
  const g={};items.forEach(t=>{const k=iview==='cat'?catById(t.catId).name:normDesc(t.desc);(g[k]=g[k]||{v:0,n:0}).v+=t.amount;g[k].n++});const ent=Object.entries(g).sort((a,b)=>b[1].v-a[1].v);
  return sec('De onde vem seu dinheiro','money',`<div class="inbox"><small>Recebido no mês, em todas as suas contas</small><div class="big num">${fmt(tot)}</div><small class="pos" style="font-weight:700">${items.length} recebimento${items.length===1?'':'s'}</small></div>
   <div class="seg" role="group" style="margin:12px 0"><button type="button" data-act="iview" data-v="cat" aria-pressed="${iview==='cat'}">Por categoria</button><button type="button" data-act="iview" data-v="orig" aria-pressed="${iview==='orig'}">Por origem</button></div>
   ${ent.length?ent.map(([k,o])=>`<div class="hbar"><span><b>${esc(k)}</b><small class="sub" style="display:block">${Math.round(o.v/tot*100)}% · ${o.n} recebimento${o.n>1?'s':''}</small></span><b class="num">${fmt(o.v)}</b><div class="track"><i style="width:${o.v/tot*100}%;background:var(--in)"></i></div></div>`).join(''):'<p class="hint">Nenhuma entrada recebida neste mês.</p>'}

   <div class="wbars">${days.map((d,k)=>{const dt=new Date(d+'T12:00');return `<button type="button" data-act="wsel" data-v="${k}" aria-pressed="${wsel===k}" aria-label="${dNum(d)}: ${fmt(v[k])}"><span class="wb"><i style="height:${v[k]/mx*100}%"></i></span><b>${WSH[dt.getDay()]}</b><small>${dNum(d)}</small></button>`}).join('')}</div>

function aProjecao(){const n=dim(M),D=cutDay(M);const daily=[...Array(n)].map((_,k)=>spendBetween(dayIn(M,k+1),dayIn(M,k+1)));const cum=[];daily.reduce((s,v,k)=>{cum[k]=s+v;return s+v},0);
  const est=projection(M),lim=S.plan.limit;const ol=outlook();const W=320,H=150,pt=12,pb=18;const mx=Math.max(1,lim||0,est,...cum);const x=k=>k/(n-1)*W,y=v=>H-pb-(H-pt-pb)*v/mx;
  let path='';for(let k=0;k<Math.max(1,D);k++)path+=(k?'L':'M')+x(k).toFixed(1)+' '+y(cum[k]||0).toFixed(1);

  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto acumulado no mês"><line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${lim?`<line x1="0" y1="${y(0)}" x2="${W}" y2="${y(lim)}" stroke="var(--muted)" stroke-dasharray="5 5" stroke-width="1.5"/>`:''}${D?`<path d="${area}" fill="var(--accent)" opacity=".15"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/><circle cx="${x(D-1)}" cy="${y(cum[D-1]||0)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>`:''}</svg>`;

function aCompromissos(){const o=monthOut(M);const late=o.items.filter(isLate).reduce((s,t)=>s+t.amount,0)+o.inv.filter(v=>!v.paid&&v.due<TODAY).reduce((s,v)=>s+v.total,0);
  const fix=S.tx.filter(t=>isFixed(t)&&ymOf(t.date)===M).reduce((s,t)=>s+t.amount,0),inst=S.tx.filter(t=>realOut(t)&&t.inst&&monthOfTx(t)===M).reduce((s,t)=>s+t.amount,0);

function aComparacao(){const pm=addM(M,-1),D=cutDay(M)||dim(M),Dp=Math.min(D,dim(pm));const a=spendBetween(M+'-01',dayIn(M,D)),b=spendBetween(pm+'-01',dayIn(pm,Dp));const ch=b?Math.round((a-b)/b*1000)/10:null,mx=Math.max(a,b,1);
  return sec('Comparação mensal','swap',`<div class="cmp"><div class="r"><span>Mês selecionado</span><b class="num">${fmt(a)}</b></div><div class="track"><i style="width:${a/mx*100}%"></i></div><div class="r"><span>Mês anterior</span><b class="num">${fmt(b)}</b></div><div class="track"><i style="width:${b/mx*100}%;background:var(--muted)"></i></div></div>
   ${ch!=null?`<p class="${ch>0?'neg':'pos'}" style="margin:10px 0 0">${String(Math.abs(ch)).replace('.',',')}% ${ch>0?'a mais':'a menos'}</p>`:''}<p class="hint" style="margin-top:6px">Compras do dia 1 até o dia ${D} de cada mês.</p>`,ch!=null?`<span class="st ${ch>0?'bad':'ok'}">${ch>0?'↑':'↓'} ${String(Math.abs(ch)).replace('.',',')}%</span>`:'')}

/* ================= v5: importar extrato (OFX/CSV), boas-vindas, novidades ================= */
const nrm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function numBR(s){s=String(s||'').trim();if(!s)return NaN;let neg=/^-|^\(.*\)$|-$/.test(s)||/\bD$/i.test(s);s=s.replace(/[^\d.,]/g,'');if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');if(lc>ld)s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');const v=parseFloat(s);return isNaN(v)?NaN:(neg?-v:v)}
function dateAny(s){s=String(s||'').trim();let m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(m[2])+'-'+pad(m[1])}
  m=/^(\d{4})(\d{2})(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];return''}
function splitCSV(line,d){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim())}
/** Extrato OFX (formato padrão dos bancos). Valor negativo = saída. */
function parseOFX(t){const rows=[];const blocks=t.split(/<STMTTRN>/i).slice(1);
  for(const b0 of blocks){const b=b0.split(/<\/STMTTRN>/i)[0];const g=k=>{const m=new RegExp('<'+k+'>([^<\\r\\n]*)','i').exec(b);return m?m[1].trim():''};
    const v=numBR(g('TRNAMT')),date=dateAny(g('DTPOSTED'));if(isNaN(v)||!date)continue;rows.push({date,value:v,desc:g('MEMO')||g('NAME')||g('PAYEE')||'',ext:g('FITID')})}
  return{rows,card:/<CREDITCARDMSGSRSV1>|<CCSTMTRS>/i.test(t),fmt:'OFX'}}
/** Extrato CSV: acha o cabeçalho e as colunas de data, valor e descrição. */
function parseCSVStmt(t){const lines=t.replace(/^﻿/,'').split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return null;let hi=-1,d=';',H=[];
  for(let i=0;i<Math.min(20,lines.length);i++){const l=nrm(lines[i]);const dl=[';',',','\t'].sort((a,b)=>l.split(b).length-l.split(a).length)[0];const cols=splitCSV(l,dl);
    if(cols.some(c=>/^(data|date|dt)\b/.test(c))&&cols.some(c=>/(valor|amount|quantia|montante|credito|debito|entrada|saida)/.test(c))){hi=i;d=dl;H=cols;break}}
  if(hi<0)return null;const idx=re=>H.findIndex(c=>re.test(c));

    case 'monthshare':monthShare(v);break;
    case 'help':helpSheet();break;
    case 'captest':{let ok=false;try{ok=AND.postTest()}catch(e){}toast(ok?'Notificação de teste enviada. Aguarde alguns segundos.':'Permita as notificações do app para testar.');break}
    case 'appsettings':try{AND.openAppSettings()}catch(e){}break;
    case 'cloudsetup':cloudSetupSheet();break;
    case 'fontsize':fontSheet();break;
    case 'fbout':try{if(AND)AND.googleSignOut()}catch(e){}if(FB.user)FB.auth.signOut().then(()=>{S.cloudUser='';persistLocal();render();toast('Você saiu da conta')});break;
    case 'premium':paywall(v);break;
    case 'buy':try{AND.buy(v)}catch(e){toast('Google Play indisponível')}break;
    case 'restore':try{AND.restore();toast('Conferindo sua assinatura…')}catch(e){}break;
    case 'managesubs':try{AND.manageSubs()}catch(e){}break;
    case 'privacy':privacySheet();break;
    case 'csv':exportCSV();break;
    case 'import':importSheet();break;
    case 'stmt':stmtSheet(a.dataset.id);break;
    case 'onboard':onboarding(1);break;
    case 'inbox':importSheet(null,true);break;
    case 'getapk':apkSheet();break;
    case 'andaccess':accessSheet();break;
    case 'unblock':S.settings.blockedApps=(S.settings.blockedApps||[]).filter(x=>x!==v);save();syncNative();render();break;
    case 'export':exportData();break;
    case 'import2':importData();break;
    case 'wipe':armDanger(a,()=>{S=defaults();save();render();toast('Dados apagados')});break;
  }});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='gq'){gq=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('gq');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  if(id==='accentpick'){S.settings.accent=e.target.value;applyTheme()}
});
document.addEventListener('change',e=>{const el=e.target,id=el.id;
  if(id==='accentpick'){S.settings.accent=el.value;save();render();colorSheet()}
  else if(id==='hidevals'){S.settings.hide=el.checked;save();render()}
  else if(id==='darkmode'){S.settings.theme=el.checked?'dark':'light';save();render()}
  else if(id==='autoimp'){if(el.checked&&!prem()){el.checked=false;paywall('auto');return}S.settings.autoImport=el.checked?'auto':'review';save();syncNative();toast(el.checked?'Anotação automática ligada':'Tudo passa pela revisão')}
  else if(id==='andalerts'){try{AND.setAlerts(el.checked)}catch(e){}}
  else if(id==='newstog'){S.settings.news=el.checked;save();syncPush();toast(el.checked?'Você vai receber novidades':'Novidades desligadas')}
  else if(id==='appalerts'){S.settings.appAlerts=el.checked;save();if(el.checked)appNotify('Avisos ligados','Você vai ser avisado quando anotar, pagar ou passar de um limite.');toast(el.checked?'Avisos do app ligados':'Avisos do app desligados')}
  else if(id==='resded'){S.settings.reserveDeduct=el.checked;save();toast(el.checked?'Reservas descontadas do saldo':'Saldo sem descontar reservas')}
  else if(el.dataset&&el.dataset.ans){const x=ansList().find(h=>h.id===el.dataset.ans);if(x){x.on=el.checked;save()}}
  else if(id==='remtog'){S.settings.reminders=el.checked;save();render()}
  else if(id==='hl'){S.settings.highlight=el.value;save();toast('Destaque salvo')}
  else if(el.dataset&&el.dataset.home){const x=S.settings.home.find(h=>h.id===el.dataset.home);if(x){x.on=el.checked;save()}}
});
if(window.matchMedia)matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(S.settings.theme==='system')applyTheme()});

load();if(!S.inbox)S.inbox=[];premInit();render();cloudInit();andPull();scheduleSync();if(!S.onboarded)setTimeout(()=>{if(!S.onboarded&&!scrim)onboarding(1)},400);document.addEventListener('visibilitychange',()=>{if(!document.hidden){andPull();if(AND&&tab==='config'&&!scrim&&!page)render()}});setInterval(()=>{if(CLOUD.st==='ok')setCloud('ok')},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
