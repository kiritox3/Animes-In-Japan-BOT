<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trocado Finanças</title>
<meta name="theme-color" content="#0D0D10">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<style>
/* fontes incluídas no app (vendor/fonts) */
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;src:url(vendor/fonts/manrope-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400 800;font-display:swap;src:url(vendor/fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url(vendor/fonts/spacegrotesk-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500 700;font-display:swap;src:url(vendor/fonts/spacegrotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

/* Layout: coluna única de até 560px, escuro por padrão. Cabeçalho por aba, barra inferior fixa com 4 abas e botão flutuante (+). Formulários em bottom sheet. Tema e cor de destaque definidos pelo usuário em Config. */
:root{
  --bg:#0D0D10; --surface:#17171C; --raised:#202027; --sunk:#111115; --ink:#F3F2F7; --muted:#9D9CAA; --line:#2A2A33;
  --in:#4ADE95; --out:#FF7B6B; --warn:#F5C451;
  --accent:#9B7BFF; --on-accent:#FFFFFF;
  --accent-text:color-mix(in srgb,var(--accent) 72%,var(--ink));
  --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Space Grotesk","Manrope",system-ui,sans-serif;
  --r:20px;
  color-scheme:dark;
}
:root.light{
  --bg:#F4F3F8; --surface:#FFFFFF; --raised:#F0EFF5; --sunk:#EAE9F0; --ink:#15141B; --muted:#686775; --line:#E1E0E9;
  --in:#13834F; --out:#D03E2D; --warn:#A06F00;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:calc(15px*var(--fs));line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .pos{color:var(--in)} .neg{color:var(--out)} .wrn{color:var(--warn)}
svg{flex:none}

.app{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ttl{font-family:var(--font-num);font-size:calc(28px*var(--fs));font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.1}
.sub{font-size:calc(13px*var(--fs));color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.newbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:16px;background:var(--accent);color:var(--on-accent);font-weight:700;padding:11px 18px;font-size:calc(16px*var(--fs))}

.monthbar{display:flex;align-items:center;justify-content:space-between;gap:4px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:14px;padding:2px 4px;margin-top:6px}
.monthbar>button{border:0;background:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.monthbar>button:hover{background:var(--raised);color:var(--ink)}
.monthbar .mlab{display:flex;align-items:center;justify-content:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.mnow{border:var(--bw) solid color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:3px 10px;font-size:calc(12px*var(--fs));font-weight:800;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sha{font-family:ui-monospace,monospace;font-size:calc(12px*var(--fs));background:var(--sunk);border:var(--bw) solid var(--line);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere;flex:1;min-width:0;user-select:all}
.monthbar span{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(15px*var(--fs));white-space:nowrap}
.monthbar span svg{color:var(--accent-text)}

section{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sec-h h2{font-family:var(--font-num);font-size:calc(20px*var(--fs));font-weight:600;margin:0;letter-spacing:-.02em}
.link{border:0;background:none;color:var(--accent-text);font-weight:700;display:flex;align-items:center;gap:4px;padding:6px 0;font-size:calc(14px*var(--fs))}
.panel{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
.lbl{font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--font-num);font-size:calc(34px*var(--fs));font-weight:700;letter-spacing:-.03em;line-height:1.05}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:calc(13px*var(--fs));margin-top:6px}
.banner button{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:7px 12px;font-size:calc(12px*var(--fs));font-weight:700;flex:none}

/* saldo das contas */
.accs{display:flex;flex-direction:column;margin-top:12px}
.accrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:var(--bw) solid var(--line);font-size:calc(14px*var(--fs));border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left}
.accrow .n{flex:1;min-width:0;display:flex;flex-direction:column}
.accrow .n b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.accrow .n small{color:var(--muted);font-size:calc(12px*var(--fs))}
.sw{width:10px;height:10px;border-radius:4px;flex:none}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:var(--bw) solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
button.tile:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tile .k{font-size:calc(13px*var(--fs));color:var(--muted);display:flex;align-items:center;gap:7px}
.tile .k i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.tile .v{font-family:var(--font-num);font-size:calc(20px*var(--fs));font-weight:600;letter-spacing:-.02em}
.tile small{font-size:calc(12px*var(--fs));color:var(--muted)}

/* gasto diário */
.daily{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 30%,var(--surface)),var(--surface) 75%);border:var(--bw) solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.daily .big{font-size:calc(40px*var(--fs))}
.daily p{margin:0;font-size:calc(13px*var(--fs));color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{border:var(--bw) solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(14px*var(--fs));justify-content:center}
.act.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* barras */
.lim{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:var(--bw) solid var(--line)}
.lim:first-child{border-top:0;padding-top:0}
.lim .r{display:flex;justify-content:space-between;gap:10px;font-size:calc(14px*var(--fs))}
.lim .r b{font-weight:600}
.track{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.lim small{font-size:calc(12px*var(--fs));color:var(--muted)}

/* cartões */
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;scrollbar-width:none;padding-bottom:2px}
.carousel::-webkit-scrollbar{display:none}
.cslide{flex:0 0 88%;max-width:440px;scroll-snap-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.cslide:only-child{flex-basis:100%}
.ccard{aspect-ratio:1.586;max-width:100%;border-radius:22px;padding:18px 20px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left;width:100%}
.ccard::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.ccard.dk{color:#16151b}
.ccard .row1{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.chipc{width:46px;height:34px;border-radius:8px;background:linear-gradient(135deg,#f2f2f2,#bdbdbd);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.chipc::before{content:"";position:absolute;inset:9px 0;border-top:var(--bw) solid rgba(0,0,0,.25);border-bottom:var(--bw) solid rgba(0,0,0,.25)}
.chipc::after{content:"";position:absolute;inset:0 15px;border-left:var(--bw) solid rgba(0,0,0,.25);border-right:var(--bw) solid rgba(0,0,0,.25)}
.ccard .bank{position:relative;z-index:1;font-family:var(--font-num);font-weight:700;font-size:clamp(22px,7vw,30px);letter-spacing:-.03em;line-height:1}
.ccard .bank small{display:block;font-family:var(--font-ui);font-weight:600;font-size:calc(12px*var(--fs));opacity:.8;letter-spacing:.04em;margin-top:6px}
.ccard .row2{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;font-weight:600}
.ccard .dig{font-family:var(--font-num);letter-spacing:.18em;font-size:calc(14px*var(--fs));opacity:.9}
.cinfo{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.cinfo .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:calc(16px*var(--fs))}
.cinfo .amt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cinfo .amt .big{font-size:calc(30px*var(--fs))}
.cinfo .amt .rt{text-align:right;font-size:calc(13px*var(--fs));color:var(--muted)}
.cinfo .amt .rt b{display:block;font-family:var(--font-num);font-size:calc(18px*var(--fs));color:var(--accent-text)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:6px 11px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted)}
.tag.ac{color:var(--accent-text)}
.limbox{border:var(--bw) solid var(--line);background:var(--sunk);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.limbox .r{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.limbox .r b{font-family:var(--font-num);font-size:calc(22px*var(--fs))}
.limbox .track i{background:var(--in)}
.limbox small{font-size:calc(13px*var(--fs));color:var(--muted);display:flex;align-items:center;gap:6px}
.carfoot{display:flex;justify-content:space-between;font-size:calc(13px*var(--fs));color:var(--muted)}
.carfoot b{color:var(--accent-text)}

/* chips de status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:calc(12px*var(--fs));font-weight:700;padding:3px 9px;border-radius:999px;background:var(--raised);color:var(--muted);white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.ok{color:var(--in);background:color-mix(in srgb,var(--in) 14%,transparent)}
.st.wait{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.st.bad{color:var(--out);background:color-mix(in srgb,var(--out) 14%,transparent)}
.st.ac{color:var(--accent-text);background:var(--accent-soft)}

/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;border:0;background:none;width:100%;text-align:left;border-top:var(--bw) solid var(--line)}
.row:first-child{border-top:0}
button.row:hover{background:var(--raised)}
.bub{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:calc(12.5px*var(--fs));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.row .amt .num{font-weight:700;font-size:calc(15px*var(--fs))}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:calc(14px*var(--fs));display:flex;flex-direction:column;align-items:center;gap:12px}

/* gastos */
.hero{border-radius:24px;padding:20px 16px;color:var(--on-accent);background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 78%,#000) ,var(--accent));display:flex;flex-direction:column;gap:16px;margin-top:14px}
.hero .lbl{color:inherit;opacity:.85}
.hero .big{font-size:calc(40px*var(--fs))}
.hero .trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .trio>button{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:16px;padding:11px 8px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.hero .trio>button[aria-pressed="true"]{background:rgba(255,255,255,.28)}
.hero .trio b{font-family:var(--font-num);font-size:clamp(12.5px,3.4vw,16px);line-height:1.2;overflow-wrap:anywhere}
.hero .trio small{font-size:calc(12px*var(--fs));opacity:.85}
.hero .trio i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border:var(--bw) solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}
.searchrow{display:flex;gap:10px;margin-top:14px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none;color:var(--ink)}
.fbtn{display:flex;align-items:center;gap:8px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:16px;padding:0 14px;color:var(--accent-text);font-weight:700}
.fbtn em{font-style:normal;background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:calc(11px*var(--fs));padding:1px 7px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;padding-block:12px 2px}
.pills::-webkit-scrollbar{display:none}
.pill{border:var(--bw) solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:calc(14px*var(--fs))}
.pill span{color:var(--muted);font-weight:600}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pill[aria-pressed="true"] span{color:inherit;opacity:.85}
.pills .sep{width:1px;background:var(--line);flex:none;margin-block:6px}
.countbar{display:flex;justify-content:space-between;align-items:center;font-size:calc(14px*var(--fs));color:var(--muted);margin-top:12px}
.countbar button{border:0;background:none;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:600;padding:6px 0}
.blockh{display:flex;align-items:center;gap:10px;font-family:var(--font-num);font-weight:600;font-size:calc(19px*var(--fs));margin:22px 0 2px}
.blockh svg{color:var(--accent-text)}
.blocksub{font-size:calc(13px*var(--fs));color:var(--muted);margin:0 0 10px}

/* análises */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.donut{display:grid;grid-template-columns:1fr;justify-items:center;gap:14px}
.donut .legend{width:100%}
@media (min-width:520px){.donut{grid-template-columns:150px 1fr;justify-items:stretch;align-items:center}}
.donut svg{width:150px;height:150px}
.legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend button{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;border:0;background:none;padding:6px 0;text-align:left;font-size:calc(13.5px*var(--fs));min-width:0}
.legend button span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chartbox svg{width:100%;height:auto;display:block}
.chartleg{display:flex;gap:14px;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:8px}
.chartleg span{display:flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:9px 0;border-top:var(--bw) solid var(--line);font-size:calc(14px*var(--fs))}
.hbar:first-child{border-top:0;padding-top:0}
.hbar .track{grid-column:1/-1}

/* config */
.cfg{display:flex;flex-direction:column}
.cfgrow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:var(--bw) solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left;min-height:56px}
.cfgrow:first-child{border-top:0}
button.cfgrow:hover{background:var(--raised)}
.cfgrow .n{flex:1;min-width:0;display:flex;flex-direction:column}
.cfgrow .n b{font-weight:600}
.cfgrow .n small{font-size:calc(12.5px*var(--fs));color:var(--muted)}
.cfgrow .tools{display:flex;gap:4px}
.cfgrow .tools button{width:34px;height:34px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.cfgrow .tools button:disabled{opacity:.35}
.toggle{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--raised);border:var(--bw) solid var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.toggle:checked{background:var(--accent);border-color:var(--accent)}
.toggle:checked::after{transform:translateX(18px);background:var(--on-accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button,.swatches label{width:36px;height:36px;border-radius:12px;border:2px solid transparent;padding:0;position:relative;overflow:hidden;cursor:pointer}
.swatches [aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.swatches label{border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.swatches label input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:var(--bw) solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:68px}
nav.tabs .tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:calc(12px*var(--fs));font-weight:700;color:var(--muted)}
nav.tabs .tab[aria-current="page"]{color:var(--accent-text)}
.fab{position:fixed;z-index:26;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 40%,transparent)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s}
.scrim.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;border:var(--bw) solid var(--line);border-bottom:0;padding:8px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(24px);transition:transform .2s}
.scrim.open .sheet{transform:none}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h3{margin:0 0 16px;font-size:calc(21px*var(--fs));font-family:var(--font-num);font-weight:700;letter-spacing:-.02em}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lb{font-size:calc(12.5px*var(--fs));font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:var(--bw) solid var(--line);background:var(--sunk);border-radius:12px;padding:12px;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.amount input{font-family:var(--font-num);font-size:calc(32px*var(--fs));font-weight:700;padding:10px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:var(--bw) solid var(--line);background:var(--sunk);border-radius:999px;padding:7px 12px 7px 8px;display:flex;align-items:center;gap:7px;font-weight:600;font-size:calc(13.5px*var(--fs))}
.chips button i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.icongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.icongrid button{height:44px;border-radius:12px;border:var(--bw) solid var(--line);background:var(--sunk);display:grid;place-items:center}
.icongrid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.hint{font-size:calc(12.5px*var(--fs));color:var(--muted);margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{flex:1;border:0;border-radius:14px;padding:14px 16px;font-weight:800;background:var(--accent);color:var(--on-accent);min-height:50px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--raised);color:var(--ink)}
.btn.danger{background:none;color:var(--out);border:var(--bw) solid var(--line)}
.btn.danger.armed{background:var(--out);color:#fff;border-color:var(--out)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:var(--bw) solid var(--line);font-size:calc(14px*var(--fs))}
.kv:first-child{border-top:0}
.verdict{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:var(--bw) solid var(--line)}
.verdict .vh{display:flex;align-items:center;gap:10px;font-family:var(--font-num);font-size:calc(22px*var(--fs));font-weight:700}
.verdict .vh i{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.verdict ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:calc(14px*var(--fs))}
.v-ok{background:color-mix(in srgb,var(--in) 10%,var(--surface))} .v-ok .vh i{background:var(--in);color:#06150d}
.v-mid{background:color-mix(in srgb,var(--warn) 10%,var(--surface))} .v-mid .vh i{background:var(--warn);color:#1c1300}
.v-no{background:color-mix(in srgb,var(--out) 10%,var(--surface))} .v-no .vh i{background:var(--out);color:#1c0503}
textarea.out{width:100%;min-height:120px;border:var(--bw) solid var(--line);background:var(--sunk);border-radius:12px;padding:10px;font-family:ui-monospace,monospace;font-size:calc(12px*var(--fs))}
.goal{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-top:var(--bw) solid var(--line);border-left:0;border-right:0;border-bottom:0;background:none;width:100%;text-align:left}
.goal:first-child{border-top:0}
.goal .r{display:flex;justify-content:space-between;gap:8px}
.goal small{font-size:calc(12px*var(--fs));color:var(--muted)}
.goal .track i{background:var(--in)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:calc(13px*var(--fs));font-weight:700;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
/* premium */
.pwhead{margin:-8px -18px 14px;padding:22px 18px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),var(--accent));color:var(--on-accent);border-radius:24px 24px 0 0}
.pwhead h3{font-size:calc(26px*var(--fs))}
.pwbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:5px 12px;font-weight:800;font-size:calc(13px*var(--fs))}
.pwlist{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.pwf{display:flex;gap:12px;align-items:flex-start}
.pwf b{display:block}
.pwf small{color:var(--muted);font-size:calc(13px*var(--fs))}
.plans{display:flex;flex-direction:column;gap:10px}
.plan{display:flex;justify-content:space-between;align-items:center;gap:12px;border:2px solid var(--line);background:var(--sunk);border-radius:16px;padding:14px 16px;text-align:left}
.plan b{font-size:calc(16px*var(--fs))}
.plan small{display:block;color:var(--muted);font-size:calc(12.5px*var(--fs));margin-top:2px}
.plan.best{border-color:var(--accent);background:var(--accent-soft)}
.lockcard{display:flex;align-items:center;gap:12px;padding:16px;width:100%;text-align:left;border:var(--bw) dashed color-mix(in srgb,var(--accent) 50%,var(--line))}
.lockcard .n{flex:1;min-width:0;display:flex;flex-direction:column}
.lockcard small{color:var(--muted);font-size:calc(13px*var(--fs))}
.policy h1{font-family:var(--font-num);font-size:calc(22px*var(--fs));margin:0 0 6px}
.policy h2{font-size:calc(16px*var(--fs));margin:18px 0 6px}
.policy p,.policy li{font-size:calc(14px*var(--fs));line-height:1.55;color:var(--ink)}
.policy ul{padding-left:20px}
/* v3: resumo, dicas, hoje, ritmo, fixas, análises */
.mpill{display:flex;align-items:center;gap:8px;border:var(--bw) solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-weight:700}
.ibtn{border:0;background:none;color:inherit;display:grid;place-items:center;padding:4px;border-radius:10px}
.rhero{border-radius:26px;padding:20px 18px;color:var(--on-accent);background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 82%,#000),var(--accent));display:flex;flex-direction:column;gap:12px}
.rhero hr{border:0;border-top:var(--bw) solid rgba(255,255,255,.2);margin:4px 0;width:100%}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rk{display:flex;align-items:center;gap:10px;font-size:calc(16px*var(--fs))}
.rl{font-size:calc(15px*var(--fs));opacity:.9}
.rhero .big{font-size:calc(38px*var(--fs))}
.rdet summary{list-style:none;display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-size:calc(14px*var(--fs));opacity:.95}
.rdet summary::-webkit-details-marker{display:none}
.rdet summary b{display:flex;align-items:center;gap:4px}
.rdet[open] summary b svg{transform:rotate(180deg)}
.rdet>div{display:flex;flex-direction:column;margin-top:8px;background:rgba(0,0,0,.14);border-radius:14px;padding:4px 12px}
.rdet>div button{display:flex;justify-content:space-between;gap:10px;border:0;background:none;color:inherit;padding:10px 0;border-top:var(--bw) solid rgba(255,255,255,.12);font-weight:600}
.rdet>div button:first-child{border-top:0}
.rcols{display:grid;grid-template-columns:1fr 1fr}
.rcols button{border:0;background:none;color:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;padding:0}
.rcols button+button{border-left:var(--bw) solid rgba(255,255,255,.25);padding-left:16px}
.rcols b{font-size:calc(19px*var(--fs))}
.rpill{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:16px;background:rgba(255,255,255,.14);color:inherit;padding:14px 16px;font-weight:700;font-size:calc(15px*var(--fs))}
.rpill span{display:flex;align-items:center;gap:10px}
.rpill span svg{background:color-mix(in srgb,var(--in) 70%,#fff);color:#06150d;border-radius:50%;padding:2px}
.rlim{position:relative;overflow:hidden;display:flex;justify-content:space-between;border:0;border-radius:999px;background:#fff;color:color-mix(in srgb,var(--accent) 70%,#000);padding:12px 18px;font-weight:700}
.rlim::before{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:color-mix(in srgb,var(--accent) 22%,#fff)}
.rlim span,.rlim b{position:relative}
.rnote{margin:-4px 0 0;font-weight:700;font-size:calc(14px*var(--fs))}
.rday{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.12);border-radius:18px;padding:16px}
.rday>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.rday span{font-weight:700;font-size:calc(14px*var(--fs))}
.rday b{font-family:var(--font-num);font-size:calc(30px*var(--fs))}
.rday small{opacity:.85;font-size:calc(12.5px*var(--fs))}
.ralert{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#FFD86B;color:#1c1300;font-weight:900;font-size:calc(18px*var(--fs))}
.racts{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rbuy{display:flex;align-items:center;gap:8px;border:0;border-radius:16px;background:#fff;color:color-mix(in srgb,var(--accent) 70%,#000);padding:12px 16px;font-weight:800}
.quick{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qh{display:flex;gap:12px;align-items:center}
.qh b{display:block}.qh small{color:var(--muted);font-size:calc(13px*var(--fs))}
.qf{display:flex;gap:8px}
.qf input{flex:1;min-width:0;border:var(--bw) solid var(--line);background:var(--sunk);border-radius:14px;padding:12px 14px}
.qf .btn{flex:none;width:50px;padding:0;border-radius:14px}
.ins{display:flex;gap:12px;align-items:flex-start;border:var(--bw) solid color-mix(in srgb,var(--tone) 30%,var(--line));background:color-mix(in srgb,var(--tone) 7%,var(--surface));border-radius:18px;padding:14px;margin-top:10px}
.ins .cico{background:color-mix(in srgb,var(--tone) 18%,transparent);color:var(--tone)}
.ins b{display:block;font-size:calc(16px*var(--fs))}
.ins p{margin:4px 0 0;color:var(--muted);font-size:calc(14px*var(--fs))}
.ins .link{padding:8px 0 0}
.dicas .ins:first-of-type{margin-top:0}
.inslist .ins:first-child{margin-top:0}
.lim2{display:flex;flex-direction:column;gap:6px;padding:12px 0}
.lim2 .r{display:flex;justify-content:space-between;gap:10px;align-items:center}
.lim2 .n{display:flex;align-items:center;gap:8px}
.lim2 small{color:var(--muted);font-size:calc(13px*var(--fs))}
.lim2 .track{height:10px}
.okbar{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--in) 12%,transparent);color:var(--in);font-weight:700}
.okbar.bad{background:color-mix(in srgb,var(--out) 12%,transparent);color:var(--out)}
hr.sep{border:0;border-top:var(--bw) solid var(--line);margin:16px 0}
.uprow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:var(--bw) solid var(--line)}
.uprow:first-of-type{border-top:0}
.uprow .main{flex:1;min-width:0;display:flex;flex-direction:column}
.uprow .main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uprow .amt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dbadge{width:46px;height:52px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.dbadge small{font-size:calc(10px*var(--fs));font-weight:800}.dbadge b{font-size:calc(19px*var(--fs));font-family:var(--font-num)}
.obtn{border:var(--bw) solid color-mix(in srgb,var(--accent) 50%,var(--line));background:none;color:var(--accent-text);border-radius:999px;padding:5px 14px;font-weight:700;font-size:calc(13px*var(--fs))}
.chipbtn{border:var(--bw) dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:4px 10px;font-size:calc(12px*var(--fs));font-weight:700;display:flex;gap:4px;align-items:center}
.cmp{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.cmp .r{display:flex;justify-content:space-between;gap:10px}
.cmp .track{height:12px}
.hpill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:700;font-size:calc(13px*var(--fs));margin-top:10px}
details.crow{border-top:var(--bw) solid var(--line);padding:10px 0}
details.crow summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
details.crow summary::-webkit-details-marker{display:none}

details.crow summary .amt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details.crow[open] summary>svg{transform:rotate(180deg)}
.inbox{background:color-mix(in srgb,var(--in) 9%,var(--surface));border-radius:16px;padding:14px}
.inbox small{color:var(--muted)}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}

.wb{width:100%;height:130px;border-radius:12px;background:var(--raised);display:flex;align-items:flex-end;overflow:hidden}

.wbars button[aria-pressed="true"]{color:var(--accent-text)}

.wbars b{font-size:calc(13px*var(--fs))}.wbars small{font-size:calc(11px*var(--fs))}
.ctile{border:var(--bw) solid color-mix(in srgb,var(--c) 35%,var(--line));background:color-mix(in srgb,var(--c) 8%,var(--surface));border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}

.invdet summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:var(--bw) solid var(--line);color:var(--accent-text);font-weight:700;cursor:pointer}

/* páginas internas, perfil, pilha de cartões */
.blogo{display:block;flex:none}
.blogo *{fill:currentColor}
.sq{overflow:hidden}
.ccard .bank .blogo{margin-bottom:8px}
.back{border:0;background:none;color:var(--accent-text);width:36px;height:42px;display:grid;place-items:center;margin-left:-8px}

const catById=id=>S.cats.find(c=>c.id===id)||{id:'',name:'Sem categoria',icon:'dots',color:'#9D9CAA',type:'out'};
const catsOf=type=>S.cats.filter(c=>c.type===type);
const accById=id=>S.accounts.find(a=>a.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
const CC=()=>S.cards.filter(c=>c.kind!=='debito');
const DC=()=>S.cards.filter(c=>c.kind==='debito'||c.kind==='ambos');
const isCredit=t=>t.type==='out'&&t.method==='credito'&&!!t.card;
function invOf(card,date){const ym=ymOf(date),d=+date.slice(8);const closeYm=d>=card.close?addM(ym,1):ym;return card.due>card.close?closeYm:addM(closeYm,1)}
function invDates(card,k){const closeYm=card.due>card.close?k:addM(k,-1);return{close:dayIn(closeYm,card.close),due:dayIn(k,card.due)}}
const invKey=(cid,k)=>cid+'|'+k;
const invTx=(cid,k)=>S.tx.filter(t=>isCredit(t)&&t.card===cid&&t.inv===k);
const invTotal=(cid,k)=>invTx(cid,k).reduce((s,t)=>s+t.amount,0);
const invPaid=(cid,k)=>!!S.paidInv[invKey(cid,k)];
function invStatus(card,k){const{close,due}=invDates(card,k);
  if(invPaid(card.id,k))return{l:'Paga',c:'ok'};
  if(TODAY<close)return{l:'Aberta',c:'ac'};
  if(TODAY>due)return{l:'Vencida',c:'bad'};
  return{l:'Fechada',c:'wait'}}
function cardKeys(c){return[...new Set(S.tx.filter(t=>isCredit(t)&&t.card===c.id).map(t=>t.inv))]}
function cardUsed(c){return cardKeys(c).reduce((s,k)=>s+(invPaid(c.id,k)?0:invTotal(c.id,k)),0)}
const isLate=t=>!t.paid&&!isCredit(t)&&t.date<TODAY;
function txStatus(t){if(isCredit(t))return null;if(t.type==='in')return t.paid?{l:'Recebido',c:'ok'}:{l:'A receber',c:'wait'};if(t.paid)return{l:'Paga',c:'ok'};if(t.date<TODAY)return{l:'Atrasada',c:'bad'};return{l:'A pagar',c:'wait'}}
const monthOfTx=t=>isCredit(t)?t.inv:ymOf(t.date);
function invoicesDue(M){return CC().map(c=>{const d=invDates(c,M);return{c,k:M,total:invTotal(c.id,M),paid:invPaid(c.id,M),close:d.close,due:d.due}}).filter(v=>v.total>0)}
function monthOut(M){const items=S.tx.filter(t=>t.type==='out'&&!t.loan&&!isCredit(t)&&ymOf(t.date)===M);const inv=invoicesDue(M);
  let total=0,paid=0;items.forEach(t=>{total+=t.amount;if(t.paid)paid+=t.amount});inv.forEach(v=>{total+=v.total;if(v.paid)paid+=v.total});
  return{items,inv,total,paid,open:total-paid}}
function monthIn(M){const items=S.tx.filter(t=>t.type==='in'&&!t.loan&&ymOf(t.date)===M);let total=0,rec=0;items.forEach(t=>{total+=t.amount;if(t.paid)rec+=t.amount});return{items,total,rec}}
function accBalance(a){let b=a.initial||0;for(const t of S.tx){if(t.accountId!==a.id||isCredit(t)||!t.paid)continue;b+=t.type==='in'?t.amount:-t.amount}
  for(const k in S.paidInv){const p=S.paidInv[k];if(p&&p.acc===a.id){const i=k.indexOf('|');b-=invTotal(k.slice(0,i),k.slice(i+1))}}
  for(const tr of S.transfers||[]){if(tr.from===a.id)b-=tr.amount;if(tr.to===a.id)b+=tr.amount}return b}
function catSpend(M){const by={};for(const t of S.tx){if(t.type!=='out'||t.loan||monthOfTx(t)!==M)continue;by[t.catId]=(by[t.catId]||0)+t.amount}return by}
function outlook(){
  const saldo=S.accounts.filter(a=>a.include!==false).reduce((s,a)=>s+accBalance(a),0);
  let pagar=0,receber=0;
  for(const t of S.tx){if(t.paid||isCredit(t)||ymOf(t.date)>CM)continue;if(t.type==='out')pagar+=t.amount;else receber+=t.amount}
  for(const c of S.cards)cardKeys(c).forEach(k=>{if(k<=CM&&!invPaid(c.id,k))pagar+=invTotal(c.id,k)});
  const livre=saldo+receber-pagar;const daysLeft=dim(CM)-(+TODAY.slice(8))+1;
  const spent=monthOut(CM).total;let perDay=Math.max(0,livre)/daysLeft;let byLimit=null;
  if(S.plan.limit>0){byLimit=Math.max(0,S.plan.limit-spent)/daysLeft;perDay=Math.min(perDay,byLimit)}
  return{saldo,pagar,receber,livre,daysLeft,perDay:Math.floor(perDay),byLimit,spent}}
function avgSurplus(){let s=0;for(let k=1;k<=3;k++){const m=addM(CM,-k);s+=monthIn(m).total-monthOut(m).total}return Math.round(s/3)}

function searchRow(ph){return `<div class="searchrow"><label class="search">${ic('search',20)}<input id="gq" type="search" placeholder="${ph}" value="${esc(gq)}" autocomplete="off"></label><button type="button" class="fbtn" data-act="filters">${ic('filter',20)}Filtros${filterCount()?`<em>${filterCount()}</em>`:''}</button></div>`}
function gOut(){
  const o=monthOut(M);const hl=S.settings.highlight;const hlTotal=S.tx.filter(t=>t.type==='out'&&t.method===hl&&monthOfTx(t)===M).reduce((s,t)=>s+t.amount,0);
  const hlLabel=(HIGHLIGHTS.find(x=>x[0]===hl)||HIGHLIGHTS[0])[1];
  let items=applyCommon(o.items.slice());let invs=o.inv.slice();
  if(gq||gcat||gacc){const vis=new Set(applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)).map(t=>t.card));invs=invs.filter(v=>vis.has(v.c.id))}
  const cnt={all:items.length+invs.length,open:items.filter(t=>!t.paid).length+invs.filter(v=>!v.paid).length,paid:items.filter(t=>t.paid).length+invs.filter(v=>v.paid).length,late:items.filter(isLate).length+invs.filter(v=>!v.paid&&v.due<TODAY).length};
  const ms=METHODS.map(m=>({...m,n:m.id==='credito'?applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)).length:items.filter(t=>t.method===m.id).length})).filter(m=>m.n>0);
  let credit=null;
  if(gmethod==='credito'){credit=sortList(applyCommon(S.tx.filter(t=>isCredit(t)&&t.inv===M)));items=[];invs=[]}
  else if(gmethod){items=items.filter(t=>t.method===gmethod);invs=[]}
  const sf={all:()=>true,open:t=>!t.paid,paid:t=>t.paid,late:isLate}[gstatus];
  const vf={all:()=>true,open:v=>!v.paid,paid:v=>v.paid,late:v=>!v.paid&&v.due<TODAY}[gstatus];
  items=sortList(items.filter(sf));invs=invs.filter(vf);
  const total=credit?credit.length:items.length+invs.length;
  const pill=(k,l,n)=>`<button type="button" class="pill" data-act="gstatus" data-v="${k}" aria-pressed="${gstatus===k&&!gmethod}">${l} <span>${n}</span></button>`;
  return `<div class="hero"><div><div class="lbl">Total do mês</div><div class="big num" style="margin-top:6px">${fmt(o.total)}</div></div>
    <div class="trio"><button type="button" data-act="gstatus" data-v="paid" aria-pressed="${gstatus==='paid'}"><i style="color:var(--in)">${ic('check',14,3)}</i><b class="num">${fmt(o.paid)}</b><small>Pago</small></button>
    <button type="button" data-act="gstatus" data-v="open" aria-pressed="${gstatus==='open'}"><i style="color:#b88300">${ic('clock',14,2.6)}</i><b class="num">${fmt(o.open)}</b><small>A pagar</small></button>
    <button type="button" data-act="gmethod" data-v="${hl}" aria-pressed="${gmethod===hl}"><i style="color:var(--accent)">${ic(methodBy(hl).i,14,2.6)}</i><b class="num">${fmt(hlTotal)}</b><small>${hlLabel}</small></button></div></div>
  <div class="acts" style="margin-top:12px"><button type="button" class="act" data-act="stmt" style="color:var(--accent-text)">${ic('receipt',18)}Importar extrato</button><button type="button" class="act" data-act="import" style="color:var(--accent-text)">${ic('bell',18)}Colar notificações</button></div>
  ${searchRow('Buscar um gasto')}
  <div class="pills">${pill('all','Todas',cnt.all)}${pill('open','A pagar',cnt.open)}${pill('paid','Pagas',cnt.paid)}${pill('late','Atrasadas',cnt.late)}
   ${ms.length?'<span class="sep"></span>':''}${ms.map(m=>`<button type="button" class="pill" data-act="gmethod" data-v="${m.id}" aria-pressed="${gmethod===m.id}">${ic(m.i,16,2.2)}${m.l} <span>${m.n}</span></button>`).join('')}</div>
  <div class="countbar"><span>${total} ${credit?'compra'+(total===1?'':'s')+' no crédito':'compromisso'+(total===1?'':'s')}</span><button type="button" data-act="sort">${ic('sort',18)}${SORTL[gsort]}</button></div>
  ${credit?`<div class="blockh">${ic('card',22)}Compras no crédito</div><p class="blocksub">Compras que caem nas faturas que vencem em ${monthName(M)}.</p><div class="panel list">${credit.length?credit.map(txRow).join(''):'<div class="empty">Nenhuma compra.</div>'}</div>`:
   `${invs.length?`<div class="blockh">${ic('card',22)}Faturas dos cartões</div><p class="blocksub">Compras no crédito ficam dentro de cada fatura.</p><div class="panel">${invs.map(v=>`<div class="invwrap">${invRow(v)}<details class="invdet"><summary>${ic('bag',18)}Ver compras (${invTx(v.c.id,v.k).length})${ic('down',18)}</summary><div class="list">${invTx(v.c.id,v.k).sort((a,b)=>a.date<b.date?1:-1).map(txRow).join('')}</div></details></div>`).join('')}</div>`:''}
    <div class="blockh">${ic('receipt',22)}Contas e gastos</div><p class="blocksub">Pix, débito, boletos e dinheiro de ${monthName(M)}.</p>
    <div class="panel list">${items.length?items.map(txRow).join(''):`<div class="empty">Nenhum gasto${gq||gcat||gacc||gstatus!=='all'||gmethod?' com esse filtro':''}.<button type="button" class="act pri" data-act="new">${ic('plus',18)}Adicionar gasto</button></div>`}</div>`}`}
function gIn(){const i=monthIn(M);let items=applyCommon(i.items.slice());
  const cnt={all:items.length,open:items.filter(t=>!t.paid).length,paid:items.filter(t=>t.paid).length};
  if(gstatus==='open')items=items.filter(t=>!t.paid);else if(gstatus==='paid'||gstatus==='late')items=items.filter(t=>t.paid);
  items=sortList(items);
  const pill=(k,l,n)=>`<button type="button" class="pill" data-act="gstatus" data-v="${k}" aria-pressed="${gstatus===k}">${l} <span>${n}</span></button>`;
  return `<div class="hero" style="background:linear-gradient(135deg,color-mix(in srgb,var(--in) 55%,#000),color-mix(in srgb,var(--in) 85%,#000));color:#fff"><div><div class="lbl">Entradas do mês</div><div class="big num" style="margin-top:6px">${fmt(i.total)}</div></div>
   <div class="trio" style="grid-template-columns:1fr 1fr"><button type="button" data-act="gstatus" data-v="paid" aria-pressed="${gstatus==='paid'}"><b class="num">${fmt(i.rec)}</b><small>Recebido</small></button><button type="button" data-act="gstatus" data-v="open" aria-pressed="${gstatus==='open'}"><b class="num">${fmt(i.total-i.rec)}</b><small>A receber</small></button></div></div>
  ${searchRow('Buscar uma entrada')}
  <div class="pills">${pill('all','Todas',cnt.all)}${pill('open','A receber',cnt.open)}${pill('paid','Recebidas',cnt.paid)}</div>
  <div class="countbar"><span>${items.length} entrada${items.length===1?'':'s'}</span><button type="button" data-act="sort">${ic('sort',18)}${SORTL[gsort]}</button></div>
  <div class="panel list" style="margin-top:8px">${items.length?items.map(txRow).join(''):`<div class="empty">Nenhuma entrada.<button type="button" class="act pri" data-act="newin">${ic('plus',18)}Adicionar entrada</button></div>`}</div>`}

/* ================= ANÁLISES ================= */
function chart6(){const ms=[];for(let k=-5;k<=0;k++)ms.push(addM(M,k));
  const data=ms.map(m=>({i:monthIn(m).total,o:monthOut(m).total}));const max=Math.max(1,...data.map(d=>Math.max(d.i,d.o)));
  const W=320,H=160,pt=16,pb=22,gw=W/6,bw=13;let s='';
  [0,.5,1].forEach(f=>{const y=pt+(H-pt-pb)*(1-f);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`});
  data.forEach((d,k)=>{const cx=gw*k+gw/2,base=H-pb,cur=ms[k]===M;const h1=(H-pt-pb)*d.i/max,h2=(H-pt-pb)*d.o/max;
    s+=`<rect x="${cx-bw-1.5}" y="${base-h1}" width="${bw}" height="${Math.max(h1,1)}" rx="4" fill="var(--in)" opacity="${cur?1:.45}"/><rect x="${cx+1.5}" y="${base-h2}" width="${bw}" height="${Math.max(h2,1)}" rx="4" fill="var(--accent)" opacity="${cur?1:.45}"/>`;
    s+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="11" font-weight="${cur?800:500}" fill="${cur?'var(--ink)':'var(--muted)'}" font-family="Manrope,system-ui">${MSH[+ms[k].slice(5)-1]}</text>`});
  s+=`<text x="2" y="11" font-size="10" fill="var(--muted)" font-family="Manrope,system-ui">${S.settings.hide?'':brl.format(max/100).replace(/,\d\d$/,'')}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e gastos dos últimos 6 meses">${s}</svg><div class="chartleg"><span><span class="sw" style="background:var(--in)"></span>Entradas</span><span><span class="sw" style="background:var(--accent)"></span>Gastos</span></div>`}
function chartDays(){const n=dim(M);const d=new Array(n).fill(0);S.tx.forEach(t=>{if(t.type==='out'&&ymOf(t.date)===M)d[+t.date.slice(8)-1]+=t.amount});
  const tot=d.reduce((a,b)=>a+b,0);const upto=M===CM?+TODAY.slice(8):M<CM?n:0;const avg=upto?Math.round(d.slice(0,upto).reduce((a,b)=>a+b,0)/upto):0;
  const max=Math.max(1,...d);const W=320,H=130,pt=10,pb=18,bw=W/n;let s='';
  d.forEach((v,k)=>{const h=(H-pt-pb)*v/max;const isT=M===CM&&k+1===+TODAY.slice(8);s+=`<rect x="${k*bw+1}" y="${H-pb-h}" width="${Math.max(1,bw-2)}" height="${Math.max(h,v?2:1)}" rx="2" fill="${isT?'var(--accent)':'color-mix(in srgb,var(--accent) 55%,var(--raised))'}" opacity="${v?1:.4}"/>`});
  if(avg){const y=H-pb-(H-pt-pb)*avg/max;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.5"/>`}
  [1,10,20,n].forEach(k=>{s+=`<text x="${(k-.5)*bw}" y="${H-4}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Manrope,system-ui">${k}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gastos por dia do mês">${s}</svg><div class="chartleg"><span><span class="sw" style="background:var(--accent)"></span>Pela data da compra</span><span><span class="sw" style="background:var(--warn)"></span>Média ${fmt(avg)}/dia</span></div><p class="hint" style="margin-top:6px">Total no mês: ${fmt(tot)}</p>`}

function crow(icn,col,title,sub,attrs,right){const tag=attrs?'button type="button"':'div';return `<${tag} class="cfgrow" ${attrs||''}><span class="cico" style="background:color-mix(in srgb,${col} 18%,transparent);color:${col}">${ic(icn,22)}</span><span class="n"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span>${right!=null?right:ic('right',18)}</${attrs?'button':'div'}>`}
function avatarHtml(sz){const u=S.settings.user||{};const st=sz?`style="width:${sz}px;height:${sz}px"`:'';const ph=u.photo||CLOUD.avatar;return ph?`<img class="avatar" ${st} src="${esc(ph)}" alt="">`:`<span class="avatar" ${st}>${esc((u.name||CLOUD.name||APP_NAME).charAt(0).toUpperCase())}</span>`}
/* ================= sheets ================= */
let scrim=null;
function openSheet(html,mount){closeSheet(true);
  scrim=document.createElement('div');scrim.className='scrim';
  scrim.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  scrim.addEventListener('click',e=>{if(e.target===scrim)closeSheet()});
  document.body.appendChild(scrim);document.body.style.overflow='hidden';
  requestAnimationFrame(()=>scrim&&scrim.classList.add('open'));
  mount&&mount(scrim.querySelector('.sheet'))}
function closeSheet(instant){if(!scrim)return;const s=scrim;scrim=null;document.body.style.overflow='';if(instant){s.remove();return}s.classList.remove('open');setTimeout(()=>s.remove(),200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='qf'){e.preventDefault();quickSubmit()}});
function armDanger(btn,fn){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');const o=btn.innerHTML;btn.textContent='Toque de novo para confirmar';setTimeout(()=>{btn.classList.remove('armed');btn.innerHTML=o},3000)}
const done=msg=>{save();closeSheet();render();if(msg)toast(msg)};
const pressGroup=(root,sel,el)=>root.querySelectorAll(sel).forEach(b=>b.setAttribute('aria-pressed',b===el));
const sel=(id,opts,val)=>`<select id="${id}">${opts.map(([v,l])=>`<option value="${v}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

/* ----- lançamento ----- */
function txForm(t,pre={}){
  const editing=!!t;
  const f=t?{...t}:Object.assign({type:'out',amount:0,desc:'',catId:'',date:TODAY,method:'pix',accountId:(S.accounts[0]||{}).id||'',card:(CC()[0]||{}).id||'',paid:true,note:'',sub:'',n:1},pre);
  if(!f.catId)f.catId=catDefault(f.type);
  if(!f.card)f.card=(CC()[0]||{}).id||'';
  const grouped=editing&&t.group;
  const catChips=tp=>catsOf(tp).map(c=>`<button type="button" data-cat="${c.id}" aria-pressed="${f.catId===c.id}"><i style="background:color-mix(in srgb,${c.color} 22%,transparent);color:${c.color}">${cicon(c,14,2.2)}</i>${esc(c.name)}</button>`).join('');

  <form class="form" id="txf" novalidate>

    ${editing?'':`<div class="seg" role="group"><button type="button" data-type="out" aria-pressed="${f.type==='out'}">Gasto</button><button type="button" data-type="in" aria-pressed="${f.type==='in'}">Entrada</button></div>`}
    <div class="field amount"><label for="f-amount" id="l-amount">Valor</label><input id="f-amount" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${f.amount?toInput(f.amount):''}"></div>
    <div class="field"><label for="f-desc">Descrição</label><input id="f-desc" placeholder="Ex.: mercado, aluguel, Netflix" value="${esc(f.desc)}" autocomplete="off"></div>
    <div class="field"><span class="lb">Categoria</span><div class="chips" id="catchips">${catChips(f.type)}</div></div>
    <div class="field" id="w-sub"><span class="lb">Subcategoria</span><div class="chips" id="subchips"></div></div>
    <div class="field"><span class="lb">Forma de pagamento</span><div class="chips" id="methchips" ${grouped?'style="pointer-events:none;opacity:.6"':''}>${methChips(f.type)}</div></div>
    <div id="w-credit" class="two"><div class="field"><label for="f-card">Cartão</label>${sel('f-card',CC().map(c=>[c.id,c.name]),f.card)}</div>
      ${editing?'':`<div class="field"><label for="f-n">Parcelas</label><input id="f-n" type="number" min="1" max="48" inputmode="numeric" value="${f.n||1}"></div>`}</div>
    <div id="w-acc" class="field"><label for="f-acc">Conta</label>${sel('f-acc',S.accounts.map(a=>[a.id,a.name]),f.accountId)}</div>
    <div id="w-status" class="seg" role="group"><button type="button" data-paid="1" aria-pressed="${!!f.paid}" id="b-paid">Pago</button><button type="button" data-paid="0" aria-pressed="${!f.paid}" id="b-open">A pagar</button></div>
    <div class="two"><div class="field"><label for="f-date" id="l-date">Data</label><input id="f-date" type="date" value="${f.date}"></div><div class="field"><label for="f-time">Horário</label><input id="f-time" type="time" value="${esc(f.time||(editing?'':nowHM()))}"></div></div>
      ${editing?'':`<div class="field" id="w-rep"><label for="f-rep">Repetir (meses)</label><input id="f-rep" type="number" min="1" max="60" inputmode="numeric" value="1"></div>`}

    <label class="cfgrow" id="w-loan" style="padding:4px 0;border:0;min-height:0"><span class="n"><b>É empréstimo</b><small id="h-loan">Mexe no saldo, mas não conta como renda nem gasto</small></span><input type="checkbox" class="toggle" id="f-loan" ${f.loan?'checked':''}></label>
    <p class="hint" id="hint"></p>
    <div class="field"><label for="f-note">Observação</label><input id="f-note" value="${esc(f.note||'')}" placeholder="Opcional" autocomplete="off"></div>
    <div class="btns"><button class="btn" type="submit">${ic('check',20,2.6)}${editing?'Salvar':'Adicionar'}</button></div>
    ${editing?`<div class="btns"><button type="button" class="btn danger" id="del1">${ic('trash',18)}Excluir${grouped?' só este':''}</button>${grouped?`<button type="button" class="btn danger" id="delAll">Excluir todos (${S.tx.filter(x=>x.group===t.group).length})</button>`:''}</div>`:''}
  </form>`,sh=>{
    const $=s=>sh.querySelector(s);
    const drawSubs=()=>{const subs=catById(f.catId).subs||[];$('#w-sub').hidden=!subs.length;$('#subchips').innerHTML=subs.map(x=>`<button type="button" style="padding-left:12px" data-sub="${esc(x)}" aria-pressed="${f.sub===x}">${esc(x)}</button>`).join('')};drawSubs();

      else if(b.dataset.meth){f.method=b.dataset.meth;pressGroup(sh,'[data-meth]',b);sync()}
      else if(b.dataset.paid){f.paid=b.dataset.paid==='1';pressGroup(sh,'[data-paid]',b);sync()}});
    sh.addEventListener('input',sync);sh.addEventListener('change',sync);sync();
    if(!editing){const go=()=>{const r=quickParse($('#fq').value);if(!r){toast('Coloque um valor, por exemplo: gastei 25 na padaria');return}const pre={type:r.type,amount:r.amount,desc:r.desc,date:r.date,method:r.method,catId:r.catId||'',n:r.n};if(r.card)pre.card=r.card;if(r.accountId)pre.accountId=r.accountId;txForm(null,pre)};$('#fq-go').onclick=go;$('#fq').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}}}
    if(!editing&&!pre.amount)setTimeout(()=>$('#f-amount').focus(),150);
    $('#txf').onsubmit=e=>{e.preventDefault();
      const amount=parseMoney($('#f-amount').value);if(!(amount>0)){$('#f-amount').focus();toast('Informe um valor maior que zero');return}

      if(editing){
        Object.assign(t,{amount,desc,note,date,time,kind,loan,catId:f.catId,sub:f.sub||''});
        if(cr){const c=cardById(grouped?t.card:$('#f-card').value);t.method='credito';t.card=c.id;t.inv=addM(invOf(c,date),(t.inst?t.inst.n:1)-1);t.paid=true}
        else{t.method=f.method;t.accountId=$('#f-acc').value;t.paid=f.paid;if(!grouped){t.card='';t.inv='';t.inst=null}}
        appNotify('Lançamento atualizado',`${txLabel(desc,f.catId,f.type)} · ${fmt(amount)}`);limitCheck(LB);return done('Salvo')}
      const base={type:f.type,desc,note,time,kind,loan,catId:f.catId,sub:f.sub||'',method:f.method};
      if(cr){const c=cardById($('#f-card').value);const n=Math.max(1,Math.min(48,parseInt($('#f-n').value)||1));const g=n>1?uid():null;const per=Math.floor(amount/n);
        for(let i=0;i<n;i++)S.tx.push({...base,id:uid(),amount:i===0?amount-per*(n-1):per,date,card:c.id,inv:addM(invOf(c,date),i),inst:n>1?{n:i+1,of:n}:null,group:g,paid:true,accountId:''});
        appNotify(`Compra no crédito: ${fmt(amount)}`,`${txLabel(desc,f.catId,f.type)} · ${n>1?n+'x de '+fmt(per)+' · ':''}fatura de ${monthName(invOf(c,date))} (${c.name})`);limitCheck(LB);
        return done(`${n>1?'Compra em '+n+'x adicionada':'Compra no cartão adicionada'} · fatura de ${monthName(invOf(c,date))}`)}
      const n=Math.max(1,Math.min(60,parseInt($('#f-rep').value)||1));const g=n>1?uid():null;
      for(let i=0;i<n;i++)S.tx.push({...base,id:uid(),amount,date:dayIn(addM(ymOf(date),i),+date.slice(8)),accountId:$('#f-acc').value,card:'',inv:'',inst:null,group:g,paid:i===0?f.paid:false});
      appNotify((f.type==='in'?(loan?'Empréstimo recebido: ':'Entrada anotada: '):(loan?'Devolução anotada: ':'Gasto anotado: '))+fmt(amount),`${txLabel(desc,f.catId,f.type)} · ${methodBy(f.method).l}${f.paid?'':' · '+(f.type==='in'?'a receber':'a pagar')+' em '+dNum(date)}${n>1?' · repetido por '+n+' meses':''}`);limitCheck(LB);
      done((n>1?`Lançado por ${n} meses`:(f.type==='in'?'Entrada adicionada':'Gasto adicionado'))+(ymOf(date)!==M?' em '+monthName(ymOf(date)):''))};
    if(editing){$('#del1').onclick=e=>armDanger(e.currentTarget,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);appNotify('Lançamento excluído',`${txLabel(t.desc,t.catId,t.type)} · ${fmt(t.amount)}`);done('Excluído')});
      const da=$('#delAll');if(da)da.onclick=e=>armDanger(e.currentTarget,()=>{const nn=S.tx.filter(x=>x.group===t.group).length;S.tx=S.tx.filter(x=>x.group!==t.group);appNotify('Lançamentos excluídos',`${nn} lançamentos de ${txLabel(t.desc,t.catId,t.type)}.`);done('Excluídos')})}
  })}

function nextIncome(r){const d=dayIn(CM,r.day);return d<TODAY?dayIn(addM(CM,1),r.day):d}
function fitNext(){const cc=CC();if(!cc.length)return null;
  const renda=S.incomes.length?S.incomes.reduce((s,r)=>s+r.amount,0):Math.round([1,2,3].reduce((s,k)=>s+monthIn(addM(CM,-k)).total,0)/3);
  const fixos=Math.round([1,2,3].reduce((s,k)=>s+monthOut(addM(CM,-k)).items.reduce((x,t)=>x+t.amount,0),0)/3);
  const fat=k=>cc.reduce((s,c)=>s+invTotal(c.id,k),0);const K=addM(CM,1);
  const avail=cc.reduce((s,c)=>s+Math.max(0,c.limit-cardUsed(c)),0);
  const cabe=Math.max(0,Math.min(renda-fixos-fat(K),avail));
  let parc=Infinity;for(let i=1;i<=6;i++)parc=Math.min(parc,renda-fixos-fat(addM(CM,i)));parc=Math.max(0,Math.min(parc,avail));
  let best=null,bd='';cc.forEach(c=>{const d=invDates(c,invOf(c,TODAY)).due;if(d>bd){bd=d;best=c}});
  return{renda,fixos,fatK:fat(K),K,avail,cabe,parc,best,bd,hasInc:S.incomes.length>0}}

/* ----- lembretes ----- */
function reminders(){const out=[];const days=d=>Math.round((new Date(d+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
  const when=n=>n<0?`Venceu há ${-n} dia${n<-1?'s':''}`:n===0?'Vence hoje':`Vence em ${n} dia${n>1?'s':''}`;
  for(const c of CC())cardKeys(c).forEach(k=>{if(invPaid(c.id,k))return;const tot=invTotal(c.id,k);if(!tot)return;const n=days(invDates(c,k).due);if(n<=5)out.push({i:'card',col:n<0?'var(--out)':'var(--warn)',t:'Fatura '+c.name,s:when(n),v:tot,act:`data-act="invoice" data-card="${c.id}" data-k="${k}"`})});
  for(const t of S.tx){if(t.paid||isCredit(t))continue;const n=days(t.date);const a=`data-act="edit" data-id="${t.id}"`;
    if(t.type==='out'&&n<=3)out.push({i:'receipt',col:n<0?'var(--out)':'var(--warn)',t:t.desc||catById(t.catId).name,s:when(n),v:t.amount,act:a});
    if(t.type==='in'&&n<=0)out.push({i:'trend',col:'var(--in)',t:t.desc||'Entrada',s:'Confirme se você já recebeu',v:t.amount,act:a})}
  const by=catSpend(CM);for(const id in S.plan.budgets){const b=S.plan.budgets[id],v=by[id]||0;if(b>0&&v>=b*.9)out.push({i:'alert',col:v>b?'var(--out)':'var(--warn)',t:'Limite de '+catById(id).name,s:v>b?'Limite estourado':Math.round(v/b*100)+'% do limite usado',v,act:'data-act="plan"'})}
  return out}
const remRow=r=>`<button type="button" class="row" ${r.act}><span class="bub" style="background:color-mix(in srgb,${r.col} 18%,transparent);color:${r.col}">${ic(r.i,20)}</span><span class="main"><span class="t">${esc(r.t)}</span><span class="s" style="color:${r.col}">${r.s}</span></span><span class="num" style="font-weight:700">${fmt(r.v)}</span></button>`;
function sLembretes(){if(!S.settings.reminders)return'';const r=reminders();if(!r.length)return'';
  return `<section><div class="sec-h"><h2>Lembretes</h2><span class="st wait">${r.length}</span></div><div class="panel list">${r.slice(0,4).map(remRow).join('')}${r.length>4?`<button type="button" class="linkbtn row" data-act="reminders" style="justify-content:center;color:var(--accent-text);font-weight:700">Ver todos (${r.length})</button>`:''}</div></section>`}

  S.transfers.forEach(tr=>{if(tr.from!==id&&tr.to!==id)return;const inn=tr.to===id;const o=accById(inn?tr.from:tr.to)||{name:'—'};
    rows.push({d:tr.date,h:`<button type="button" class="row" data-act="edittr" data-id="${tr.id}"><span class="bub" style="background:var(--raised);color:var(--muted)">${ic('swap',20)}</span><span class="main"><span class="t">${inn?'Recebido de':'Enviado para'} ${esc(o.name)}</span><span class="s">Transferência · ${dNum(tr.date)}</span></span><span class="num ${inn?'pos':''}" style="font-weight:700">${inn?'+ ':'− '}${fmt(tr.amount)}</span></button>`})});
  for(const k in S.paidInv){const p=S.paidInv[k];if(!p||p.acc!==id)continue;const i=k.indexOf('|');const c=cardById(k.slice(0,i));if(!c)continue;const m=k.slice(i+1);
    rows.push({d:p.date,h:`<button type="button" class="row" data-act="invoice" data-card="${c.id}" data-k="${m}"><span class="bub" style="${cardBg(c)};color:${cardDark(c)?'#16151b':'#fff'}">${ic('card',20)}</span><span class="main"><span class="t">Fatura ${esc(c.name)}</span><span class="s">Pagamento · ${dNum(p.date)}</span></span><span class="num" style="font-weight:700">− ${fmt(invTotal(c.id,m))}</span></button>`})}

   <div class="panel list">${rows.length?rows.slice(0,60).map(r=>r.h).join(''):'<div class="empty">Nenhuma movimentação nesta conta.</div>'}</div>`)}

const BANK_WORDS=[['nubank',/nubank|\bnu\b/i],['picpay',/picpay/i],['mercadopago',/mercado\s?pago/i],['inter',/\binter\b|banco inter/i],['c6',/\bc6\b/i],['itau',/ita[uú]/i],['bradesco',/bradesco/i],['santander',/santander/i],['bb',/banco do brasil|\bbb\b/i],['caixa',/\bcaixa\b/i],['pagbank',/pagbank|pagseguro/i],['neon',/\bneon\b/i],['next',/\bnext\b/i],['will',/will\s?bank/i],['sicredi',/sicredi/i]];
const CAT_WORDS=[['Mercado',/mercado|supermerc|atacad|assa[ií]|carrefour|extra\b|p[aã]o de a[cç]|hortifruti|a[cç]ougue|feira/i],['Alimentação',/ifood|restaur|lanch|padaria|burger|pizza|mc ?donald|bk\b|subway|caf[eé]|bar\b|sorvet|a[cç]a[ií]|rappi|z[eé] delivery/i],['Transporte',/uber|\b99\b|99app|cabify|posto|combust|shell|ipiranga|petrobr|br mania|estaciona|metr[oô]|[oô]nibus|sem parar|veloe|ped[aá]gio/i],['Saúde',/farm[aá]|drog|raia|pacheco|pague menos|cl[ií]nica|hospital|laborat|odonto|academia|smart ?fit/i],['Assinaturas',/netflix|spotify|crunchyroll|prime video|amazon prime|disney|hbo|max\b|youtube|deezer|apple\.com|google one|icloud|globoplay|paramount/i],['Compras',/amazon|shopee|mercado ?livre|magalu|magazine|americanas|aliexpress|shein|renner|riachuelo|c&a|zara|kabum|casas bahia/i],['Contas',/energia|enel|cemig|light\b|copel|sabesp|[aá]gua|internet|vivo|claro|\btim\b|\boi\b|net\b|g[aá]s|condom[ií]nio|boleto/i],['Lazer',/cinema|ingresso|steam|playstation|xbox|nintendo|show|teatro|parque/i],['Educação',/escola|faculdade|curso|udemy|alura|livrar/i],['Moradia',/aluguel|imobili|condom/i]];
function nParse(text){const t=text.replace(/\s+/g,' ').trim();const m=t.match(/R\$\s?(-?[\d.]+,\d{2}|-?\d+(?:\.\d{2})?)/i);if(!m)return null;
  const amount=Math.abs(parseMoney(m[1]));if(!(amount>0))return null;
  const isIn=/(voc[eê] recebeu|recebid[oa]|pix recebido|transfer[eê]ncia recebida|caiu na (sua )?conta|dep[oó]sito|estorno|reembolso|cashback|rendimento|cr[eé]dito em conta|sal[aá]rio)/i.test(t)&&!/(compra|pagou|enviou|enviad[oa]|pagamento (de|efetuado|realizado|aprovado))/i.test(t.replace(/estorno.*$/i,''));
  let method='pix';if(/d[eé]bito/i.test(t))method='debito';else if(/boleto/i.test(t))method='boleto';else if(/\bpix\b/i.test(t))method='pix';else if(/transfer[eê]ncia|\bted\b|\bdoc\b/i.test(t))method='transf';else if(/cart[aã]o|cr[eé]dito|compra (aprovada|de|no)|parcela/i.test(t))method='credito';
  if(isIn&&method==='credito')method='pix';
  let desc='';const pats=isIn?[/\bde\s+([^.,;!\n]+?)(?=\s+(?:no|na|em|via|pelo|pela|para|com)\b|[.,;!]|$)/i,/\bpor\s+([^.,;!]+?)(?=[.,;!]|$)/i]:[/\bem\s+([^.,;!\n]+?)(?=\s+(?:no|na|para|com|via|pelo|pela|às|as|dia|hoje|em \d)\b|[.,;!]|$)/i,/\bpara\s+(?!o cart|a conta|seu cart|sua conta)([^.,;!\n]+?)(?=\s+(?:no|na|via|com|às|as)\b|[.,;!]|$)/i,/\b(?:no|na)\s+([A-Z0-9*][^.,;!\n]+?)(?=\s+(?:com|no|na|para|via|pelo|pela|às|as)\b|[.,;!]|$)/];
  const tail=t.slice(m.index+m[0].length);for(const p of pats){const x=tail.match(p)||t.match(p);if(!x)continue;const v=x[1].replace(/\s*\d{2}\/\d{2}(\/\d{2,4})?.*$/,'').replace(/\s*\d{1,2}:\d{2}.*$/,'').trim();if(v&&!/R\$|cart[aã]o|final \d|valor de|conta/i.test(v)&&v.length<=48){desc=v;break}}
  if(!desc){const h=t.match(/^([^:]{2,30}):/);if(h&&!BANK_WORDS.some(([,r])=>r.test(h[1]))&&!/pix|compra|transfer|aviso|alerta/i.test(h[1]))desc=h[1].trim()}
  desc=desc.replace(/^(o|a|os|as)\s+/i,'').replace(/\s+(aprovad[oa]|realizad[oa]|confirmad[oa])$/i,'');
  if(desc===desc.toUpperCase())desc=desc.toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
  let date=TODAY;const dm=t.match(/\b(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\b/);if(dm){let y=dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):TODAY.slice(0,4);const d=y+'-'+dm[2]+'-'+dm[1];if(!isNaN(new Date(d+'T12:00'))&&d<=TODAY)date=d}
  const l4=(t.match(/final\s*(\d{4})/i)||[])[1];const bank=(BANK_WORDS.find(([,r])=>r.test(t))||[])[0]||'';
  let card='',accountId='';if(method==='credito'){const c=(l4&&CC().find(c=>c.last4===l4))||(bank&&CC().find(c=>c.bank===bank))||(CC().length===1?CC()[0]:null);if(c)card=c.id;else method='debito'}
  const dc=method==='debito'?((l4&&S.cards.find(c=>c.last4===l4))||(bank&&S.cards.find(c=>c.bank===bank))):null;
  const acc=(dc&&accById(dc.accountId))||(bank&&S.accounts.find(a=>a.bank===bank))||S.accounts[0];accountId=acc?acc.id:'';
  const type=isIn?'in':'out';const prev=desc&&S.tx.slice().reverse().find(x=>x.type===type&&x.desc&&x.desc.toLowerCase()===desc.toLowerCase());
  let catId=prev?prev.catId:'';if(!catId){const name=type==='out'?(CAT_WORDS.find(([,r])=>r.test(desc+' '+t))||[])[0]:null;const c=name&&catsOf(type).find(c=>c.name===name);catId=(c||catsOf(type).find(c=>c.name==='Outros')||catsOf(type)[0]||{}).id||''}
  const dup=S.tx.some(x=>x.type===type&&x.amount===amount&&x.date===date&&(!desc||!x.desc||x.desc.toLowerCase()===desc.toLowerCase()));
  return{id:uid(),src:t,type,amount,desc:desc||(isIn?'Entrada':'Gasto'),catId,date,method,card,accountId,on:!dup,dup,low:!desc}}
function nSplit(raw){const blocks=raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);const out=[];
  blocks.forEach(b=>{const lines=b.split('\n').map(x=>x.trim()).filter(Boolean);const withR=lines.filter(l=>/R\$/.test(l));if(withR.length>1){let buf=[];lines.forEach(l=>{buf.push(l);if(/R\$/.test(l)){out.push(buf.join(' '));buf=[]}});if(buf.length&&out.length)out[out.length-1]+=' '+buf.join(' ')}else out.push(lines.join(' '))});return out}
function nRow(it,i){const cats=catsOf(it.type);const ms=METHODS.filter(m=>it.type==='out'||IN_METHODS.includes(m.id)).filter(m=>m.id!=='credito'||CC().length);
  return `<div class="nitem ${it.on?'':'off'}" data-i="${i}"><div class="nh"><input type="checkbox" class="toggle" data-n="on" ${it.on?'checked':''} aria-label="Importar este"><div class="seg" role="group" style="flex:1"><button type="button" data-ntype="out" aria-pressed="${it.type==='out'}">Gasto</button><button type="button" data-ntype="in" aria-pressed="${it.type==='in'}">Entrada</button></div></div>
   ${it.dup?'<span class="st bad">Parece repetido: já existe um lançamento igual</span>':it.low?'<span class="st wait">Confira a descrição</span>':''}
   <p class="nsrc">${it.app?'<b>'+esc(it.app)+'</b> · ':''}${esc(it.src)}</p>${it.pkg?`<button type="button" class="link" data-block="${esc(it.pkg)}" style="align-self:flex-start;padding:0;font-size:calc(13px*var(--fs))">Não ler mais ${esc(it.app||'este app')}</button>`:''}

   <div class="field"><label>Descrição</label><input data-n="desc" value="${esc(it.desc)}"></div>
   <div class="two"><div class="field"><label>Categoria</label><select data-n="catId">${cats.map(c=>`<option value="${c.id}" ${c.id===it.catId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
   <div class="field"><label>Forma</label><select data-n="method">${ms.map(m=>`<option value="${m.id}" ${m.id===it.method?'selected':''}>${m.l}</option>`).join('')}</select></div></div>
   ${it.method==='credito'?`<div class="field"><label>Cartão</label><select data-n="card">${CC().map(c=>`<option value="${c.id}" ${c.id===it.card?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:`<div class="field"><label>Conta</label><select data-n="accountId">${S.accounts.map(a=>`<option value="${a.id}" ${a.id===it.accountId?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>`}</div>`}
function importSheet(prefill,inbox,preset){let items=inbox?(S.inbox||[]).slice():preset?preset.items:[];
  openSheet(preset?`<h3>${esc(preset.title)}</h3><p class="hint" style="margin-bottom:12px">${esc(preset.hint)}</p><div id="n-out"></div>`:inbox?`<h3>Revisar lançamentos capturados</h3><p class="hint" style="margin-bottom:12px">Confira o que o Trocado leu nas notificações. Os desmarcados serão descartados.</p><div id="n-out"></div>`:`<h3>Importar notificações do banco</h3>
   <p class="hint" style="margin-bottom:12px">Copie o texto das notificações (Nubank, PicPay, Mercado Pago, Inter e outros) e cole aqui. Pode colar várias de uma vez, separadas por linha em branco. O app lê valor, loja, cartão e data, e você confere antes de salvar.</p>
   <div class="form"><div class="field"><label for="n-text">Texto das notificações</label><textarea class="out" id="n-text" style="min-height:130px;font-family:var(--font-ui);font-size:calc(14px*var(--fs))" placeholder="Ex.: Compra de R$ 42,50 APROVADA em PADARIA BOM PAO para o cartão com final 4821.&#10;&#10;Você recebeu uma transferência de R$ 150,00 de Maria Souza.">${esc(prefill||'')}</textarea></div>
   <div class="btns"><button type="button" class="btn" id="n-read">${ic('search',20)}Ler notificações</button></div></div>
   <div id="n-out" style="margin-top:16px"></div>`,sh=>{const $=s=>sh.querySelector(s);
    const draw=()=>{const sel=items.filter(x=>x.on).length;

    const read=()=>{const raw=$('#n-text').value;const parts=nSplit(raw);items=parts.map(nParse).filter(Boolean);const bad=parts.length-items.length;draw();
      if(!parts.length)toast('Cole o texto de uma notificação');else if(!items.length)toast('Não achei nenhum valor em R$ no texto');else if(bad)toast(bad+' trecho'+(bad>1?'s':'')+' sem valor foi ignorado')};
    if($('#n-read'))$('#n-read').onclick=read;if(prefill)read();if(inbox||preset)draw();
    sh.addEventListener('input',e=>{const el=e.target,box=el.closest('.nitem');if(!box)return;const it=items[+box.dataset.i],k=el.dataset.n;if(!k||k==='on')return;

        if(it.type==='in'&&!IN_METHODS.includes(it.method))it.method='pix';const c=catsOf(it.type);it.catId=(c.find(x=>x.name==='Outros')||c[0]||{}).id||'';draw();return}
      const bk=e.target.closest('[data-block]');if(bk){const pkg=bk.dataset.block,it0=items.find(x=>x.pkg===pkg);S.settings.blockedApps=[...new Set([...(S.settings.blockedApps||[]),pkg])];S.settings.appNames=Object.assign(S.settings.appNames||{},{[pkg]:it0&&it0.app||pkg});
        items=items.filter(x=>x.pkg!==pkg);S.inbox=(S.inbox||[]).filter(x=>x.pkg!==pkg);save();draw();syncNative();toast('Não vou mais ler '+(it0&&it0.app||'esse app'));return}
      if(e.target.closest('#n-save')){const ok=items.filter(x=>x.on);const LB=limitSnap();ok.forEach(addParsed);const n=ok.length;if(n){appNotify(`${n} lançamento${n>1?'s':''} adicionado${n>1?'s':''}`,preset?'Vindos do extrato do banco.':'Vindos das notificações do banco.');limitCheck(LB)}
        if(inbox){const ids=new Set(items.map(x=>x.id));S.inbox=(S.inbox||[]).filter(x=>!ids.has(x.id))}
        done(n?n+' lançamento'+(n===1?'':'s')+' adicionado'+(n===1?'':'s'):'Descartados')}})})}

const AND=(()=>{try{return window.CaixaAndroid||null}catch(e){return null}})();
const APK_URL='https://github.com/kiritox3/Animes-In-Japan-BOT/releases/tag/caixa-android-latest';
function addParsed(it){const cr=it.type==='out'&&it.method==='credito'&&cardById(it.card);
  const base={id:uid(),type:it.type,amount:it.amount,desc:String(it.desc||'').trim(),catId:it.catId,sub:'',date:it.date||TODAY,time:it.time||'',method:it.method,note:it.note||(it.app?'Capturado de '+it.app:'Importado de notificação'),ext:it.ext||'',group:null,inst:null};
  if(cr){const c=cardById(it.card);S.tx.push({...base,card:c.id,inv:invOf(c,base.date),paid:true,accountId:''})}
  else S.tx.push({...base,method:it.method==='credito'?'debito':it.method,card:'',inv:'',paid:true,accountId:it.accountId||(S.accounts[0]||{}).id})}
const ymdOf=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function andPull(){if(!AND)return;let arr=[];try{arr=JSON.parse(AND.pull()||'[]')}catch(e){arr=[]}if(!arr.length)return;
  const blocked=S.settings.blockedApps||[];S.inbox=S.inbox||[];let added=0,queued=0,test=false;
  arr.forEach(n=>{if(!n||!n.text||blocked.includes(n.pkg))return;const it=nParse(n.text);if(!it)return;
    if(n.test){test=true;return}
    if(n.time&&it.date===TODAY)it.date=ymdOf(n.time);if(n.time){const d=new Date(n.time);it.time=pad(d.getHours())+':'+pad(d.getMinutes())}it.app=n.app||'';it.pkg=n.pkg||'';it.src=n.text.replace(/\s+/g,' ');
    if((n.auto||S.settings.autoImport==='auto')&&prem()&&!it.dup&&!it.low){addParsed(it);added++}else{S.inbox.push(it);queued++}});
  if(test){openSheet(`<h3>Teste funcionou</h3><div class="capbox">${ic('check',28,2.4)}<div><b>A leitura das notificações está ativa</b><p>O ${APP_NAME} recebeu e entendeu a notificação de teste. Ela não foi anotada.</p></div></div>`)}
  if(!added&&!queued)return;save();if(!scrim)render();
  if(added)appNotify(`${added} lançamento${added>1?'s':''} anotado${added>1?'s':''} das notificações`,'Toque para ver no app.');
  toast(added&&queued?`${added} adicionado${added>1?'s':''}, ${queued} para revisar`:added?`${added} lançamento${added>1?'s':''} adicionado${added>1?'s':''} das notificações`:`${queued} lançamento${queued>1?'s':''} para revisar`)}
window.caixaNotif=andPull;

function apkSheet(){openSheet(`<h3>Trocado para Android</h3>

const APP_NAME='Trocado';
const APP_VERSION='1.1';
let HM=CM,htab='desp',aview='cat',apaid=true,iview='cat',wsel=6,dicasOpen=false;
const WEEKD=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const WSH=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const addD=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const realOut=t=>t.type==='out'&&!t.loan;
const realIn=t=>t.type==='in'&&!t.loan;
/** Soma das compras (pela data da compra, como no extrato do banco) entre duas datas, inclusive. */
function spendBetween(a,b){let s=0;for(const t of S.tx)if(realOut(t)&&t.date>=a&&t.date<=b)s+=t.amount;return s}
const dayOfMonth=()=>+TODAY.slice(8);
/** Até que dia comparar: hoje no mês atual, o mês inteiro nos meses passados. */
const cutDay=M=>M===CM?dayOfMonth():M<CM?dim(M):0;
function reservesTotal(){return S.plan.goals.reduce((s,g)=>s+(g.saved||0),0)}
function saldoTotal(){return S.accounts.filter(a=>a.include!==false).reduce((s,a)=>s+accBalance(a),0)}
function isPaidOut(t){return isCredit(t)?invPaid(t.card,t.inv):!!t.paid}
function isFixed(t){return realOut(t)&&!isCredit(t)&&(t.kind==='fixa'||t.kind==='assinatura'||(!!t.group&&!t.inst))}
function projection(M){const sp=spendBetween(M+'-01',dayIn(M,cutDay(M)||1));if(M!==CM)return sp;const d=dayOfMonth();return Math.round(sp/d*dim(M))}

/* ---------- dicas (regras simples sobre os seus números) ---------- */
function insights(M){const out=[];const D=cutDay(M);if(!D)return out;const pm=addM(M,-1);
  const cur=M+'-01',curEnd=dayIn(M,D),prev=pm+'-01',prevEnd=dayIn(pm,Math.min(D,dim(pm)));
  const by={},byPrev={};for(const t of S.tx){if(!realOut(t))continue;if(t.date>=cur&&t.date<=curEnd)by[t.catId]=(by[t.catId]||0)+t.amount;if(t.date>=prev&&t.date<=prevEnd)byPrev[t.catId]=(byPrev[t.catId]||0)+t.amount}
  const tot=Object.values(by).reduce((a,b)=>a+b,0);
  if(M===CM&&S.plan.limit>0){const p=projection(M);if(p>S.plan.limit)out.push({i:'alert',tone:'warn',t:'O previsto passou do limite deste mês',d:`No ritmo atual, o mês fecha perto de ${fmt(p)}, ${fmt(p-S.plan.limit)} acima do seu limite de ${fmt(S.plan.limit)}. Revise os pendentes e veja se o plano ainda faz sentido.`,act:'plan',al:'Ajustar orçamento'})}
  const over=Object.entries(S.plan.budgets).filter(([id,v])=>v>0&&(catSpend(M)[id]||0)>v);
